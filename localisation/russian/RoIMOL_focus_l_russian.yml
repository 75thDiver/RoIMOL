 # === НЕПОЛИТИЧЕСКИЕ ВЕТКИ (переработанные) ===
 # ======================================================

 # === АРМИЯ: «Днестровский щит» ===
 MOL_arm_army_reform: "Реформа армии"
 MOL_arm_army_reform_desc: "Наша армия мала, но мы сделаем её профессиональной. Новые уставы, тренировки и структура командования — вот фундамент нашей обороны."
 MOL_arm_river_defense: "Оборона на реках"
 MOL_arm_river_defense_desc: "Прут и Днестр — естественные крепости Молдовы. Инженерные работы превратят берега в неприступные рубежи: бункеры, траншеи, минные поля."
 MOL_arm_officer_school: "Офицерская школа"
 MOL_arm_officer_school_desc: "Новое поколение командиров учится в офицерской школе под Кишинёвом. Но кого мы воспитаем — верных румынской традиции или истинно молдавских патриотов?"
 MOL_arm_romanian_officers: "Румынские инструкторы"
 MOL_arm_romanian_officers_desc: "Опытные офицеры из Бухареста обучают наших командиров. Профессионализм растёт, но наши командиры всё больше оглядываются на Румынию."
 MOL_arm_local_officers: "Местные командиры"
 MOL_arm_local_officers_desc: "Выходцы из молдавских сёл и городов возглавляют войска. Они знают свою землю, говорят на языке народа и будут защищать её до последнего."
 MOL_arm_militia_reserves: "Ополченческие резервы"
 MOL_arm_militia_reserves_desc: "Каждый крестьянин с ружьём — потенциальный защитник родины. Система народного ополчения даёт нам резерв на случай большой войны."
 MOL_arm_artillery_school: "Артиллерийская школа"
 MOL_arm_artillery_school_desc: "Артиллерия — бог войны. Наша новая школа готовит специалистов, способных вести точный огонь по любым целям."
 MOL_arm_field_exercises: "Полевые учения"
 MOL_arm_field_exercises_desc: "Крупные манёвры объединят все рода войск. Армия покажет, что она готова защищать каждый клочок молдавской земли."

 # === АВИАЦИЯ: «Молдавские крылья» ===
 MOL_air_club: "Аэроклуб Кишинёва"
 MOL_air_club_desc: "Энтузиасты-авиаторы готовят будущих пилотов. Каждый час в небе — шаг к собственной авиации."
 MOL_air_licenses: "Лицензионное производство"
 MOL_air_licenses_desc: "Мы не можем с нуля разработать самолёты. Но мы можем купить лицензии и собирать иностранные машины на своих заводах."
 MOL_air_ground_support: "Поддержка с воздуха"
 MOL_air_ground_support_desc: "Наша авиация нужна не для стратегических бомбёжек, а для поддержки пехоты. Штурмовики — глаза и кулак армии на поле боя."

 # === ФЛОТ: «Днестровская флотилия» ===
 MOL_nav_danube_flotilla: "Дунайская флотилия"
 MOL_nav_danube_flotilla_desc: "Молдове не нужен океанский флот. Нам нужны речные корабли — для охраны Дуная, Днестра и черноморского побережья."
 MOL_nav_izmail_port: "Порт Измаил"
 MOL_nav_izmail_port_desc: "Дунайский порт Измаил — наши ворота в Чёрное море. Расширим его для торговли и военных нужд."
 MOL_nav_monitors: "Речные мониторы"
 MOL_nav_monitors_desc: "Бронированные речные корабли поддержат армию огнём с воды и будут охранять переправы через Днестр и Дунай."

 # === ПРОМЫШЛЕННОСТЬ: «Бессарабский чернозём» ===
 MOL_ind_bessarabian_soil: "Чернозём Бессарабии"
 MOL_ind_bessarabian_soil_desc: "Бессарабская земля — наше главное богатство. Чернозёмы кормят страну и дают основу для экономики, но индустриализация только начинается."
 MOL_ind_vineyards: "Виноградники Кодру"
 MOL_ind_vineyards_desc: "Молдавские вина — от «Негру де Пурчурь» до «Фетяска» — известны во всей Европе. Расширим виноградники и винодельни для экспорта."
 MOL_ind_food_processing: "Пищевая промышленность"
 MOL_ind_food_processing_desc: "Консервные заводы, сахарные мельницы и маслобойни превращают дары земли в товары, идущие на экспорт."
 MOL_ind_military_workshops: "Военные мастерские"
 MOL_ind_military_workshops_desc: "Небольшие мастерские Кишинёва и Тирасполя перестраиваются на выпуск вооружений для обороны родной земли."
 MOL_ind_railways: "Железные дороги Бессарабии"
 MOL_ind_railways_desc: "Инфраструктура — это не роскошь, а необходимость. Новые дороги свяжут Кишинёв с Измаилом и обеспечат снабжение армии."
 MOL_ind_resource_survey: "Геологическая разведка"
 MOL_ind_resource_survey_desc: "Под бессарабской землёй скрыты стратегические ресурсы. Их добыча даст промышленности сырьё для развития."
 MOL_ind_chisinau_university: "Кишинёвский университет"
 MOL_ind_chisinau_university_desc: "Наш первый настоящий университет подготовит инженеров, учёных и врачей. Наука — основа будущего Молдовы."
 MOL_ind_modernization: "Модернизация"
 MOL_ind_modernization_desc: "От аграрной страны к современному государству — путь пройден. Наша промышленность готова конкурировать с соседями."

 MOL_land_doctrine_bonus: "Учения наземной доктрины"
 MOL_land_doctrine_bonus_2: "Углублённые учения наземной доктрины"
 MOL_air_doctrine_bonus: "Учения воздушной доктрины"
 MOL_naval_doctrine_bonus: "Учения морской доктрины"
 MOL_artillery_bonus: "Артиллерийская программа"
 MOL_light_fighter_bonus: "Программа лёгких истребителей"
 MOL_cas_bonus: "Программа штурмовиков"
 MOL_destroyer_bonus: "Программа эсминцев"
 MOL_industrial_bonus: "Промышленная программа"
 MOL_industry_bonus: "Программа модернизации промышленности"

 # ==================== ЗЕЛЁНАЯ ВЕТКА: РАЗВИЛКА ДИНАСТИЙ ====================
 MOL_mon_dynasty_native: "Дом Богдановичей"
 MOL_mon_dynasty_native_desc: "На трон взойдёт наш собственный господарь — Мирча IV Богданович, потомок старых боярских родов Бессарабии. Никаких чужих дворов и чужих интересов: династия отвечает только перед молдавской землёй. Народ примет такого господаря как своего, но Европа посмотрит на нас как на провинциалов, а придворная наука будет отставать."
 MOL_mon_dynasty_habsburg: "Габсбургская корона"
 MOL_mon_dynasty_habsburg_desc: "Эрцгерцог Леопольд-Карл фон Габсбург-Лотарингский готов принять молдавскую корону. Брак с европейским домом открывает доступ к дипломатии великих держав, кредитам и науке. Цена — часть самостоятельности и недоверие крестьян к «чужому» королю: на призыв и поддержку войны рассчитывать не приходится."
 MOL_mon_dynasty_romanov: "Романовский скипетр"
 MOL_mon_dynasty_romanov_desc: "Государь Алексий III Романов, глава российской императорской ветви в изгнании, переносит свой двор в Кишинёв. За ним идут тысячи офицеров, казаков и чиновников — готовые кадры для армии и управления. Москва сочтёт это вызовом, казна не досчитается денег на содержание двора, а крестьяне не поймут, за что им воевать чужую войну."
 MOL_mon_native_sfatul: "Сфатул Цэрий под короной"
 MOL_mon_native_sfatul_desc: "Господарь правит не один: при нём собираются представители жудецов, городов и церкви. Старое собрание молдавской земли становится постоянным советом короны. Решения принимаются медленнее, зато народ видит в них свою волю и охотнее идёт под знамёна."
 MOL_mon_native_land_army: "Земля и сабля"
 MOL_mon_native_land_army_desc: "Крестьянин, получивший надел, защищает его сам. Земельные наделы ветеранам и всеобщая воинская повинность дают господарю армию, которой не нужны казармы: каждый дом — часть обороны, каждое село — резерв."
 MOL_mon_habsburg_diplomacy: "Двор в Кишинёве"
 MOL_mon_habsburg_diplomacy_desc: "Габсбургский двор приносит с собой дипломатическую школу, торговые связи и европейских инженеров. Наши послы говорят на языке венских и будапештских кабинетов, а контракты на займы подписываются быстрее, чем у соседей."
 MOL_mon_danubian_pact: "Дунайский пакт"
 MOL_mon_danubian_pact_desc: "Монархии Дуная и Балкан связаны общей судьбой: слишком малы поодиночке, слишком горды, чтобы подчиняться великим державам. Кишинёв собирает их под общим знаменем — союз, который держится на династических узах и торговле, а не на идеологии."
 MOL_mon_romanov_emigre: "Белая эмиграция"
 MOL_mon_romanov_emigre_desc: "Офицеры, казаки, чиновники и профессора, потерявшие родину, находят пристанище при молдавском дворе. Они приносят военные знания, дисциплину и ненависть к большевикам — армию, которую не нужно учить с нуля."

 # ==================== ЗЕЛЁНАЯ ВЕТКА v2: ЛИНИИ ДИНАСТИЙ ====================
 MOL_mon_native_church_synod: "Автокефалия митрополии"
 MOL_mon_native_church_synod_desc: "Молдавская митрополия получает собственный синод и независимость от Бухареста. Церковь становится опорой трона: она венчает господаря, ведёт школы и удерживает народ от чужих вероучений."
 MOL_mon_native_fortress: "Крепость на Пруте"
 MOL_mon_native_fortress_desc: "Прут и Днестр — естественные рвы господарства. Инженерные работы превращают берега в линию бункеров и укреплений: чужая армия увязнет здесь раньше, чем дойдёт до Кишинёва."
 MOL_mon_native_land_reform: "Земля крестьянам"
 MOL_mon_native_land_reform_desc: "Конфискованные и выкупленные наделы раздаются крестьянским общинам. Народ, получивший землю от господаря, идёт за него воевать охотнее, чем по любому указу."
 MOL_mon_native_budjak: "Освоение Буджака"
 MOL_mon_native_budjak_desc: "Степной юг — пустые земли и богатые почвы. Переселенцы, колодцы и дороги превращают Буджак из окраины в житницу и ресурсную базу княжества."
 MOL_mon_native_guard: "Гвардия господаря"
 MOL_mon_native_guard_desc: "Отборные сотни из земских ополчений составляют личную гвардию трона. Они обучены, экипированы и преданы династии, а не партии."
 MOL_mon_habs_trade_league: "Дунайская торговая лига"
 MOL_mon_habs_trade_league_desc: "Кишинёвские и венские купцы складываются в лигу: единые пошлины, общие склады, защищённые караваны. Торговля по Дунаю приносит двору больше, чем любые подати."
 MOL_mon_habs_guard_regiments: "Гвардейские полки двора"
 MOL_mon_habs_guard_regiments_desc: "Придворные полки набираются и обучаются по австрийскому образцу: муштра, офицерские курсы, единый мундир. Армия двора немногочисленна, но образцова."
 MOL_mon_habs_railways: "Дунайские железные дороги"
 MOL_mon_habs_railways_desc: "Ветки от Кишинёва к Измаилу и к карпатским перевалам связывают владения двора. Войска и товары теперь перемещаются по рельсам, а не по просёлкам."
 MOL_mon_habs_industry: "Придворные мануфактуры"
 MOL_mon_habs_industry_desc: "Двор жалует привилегии и кредиты мануфактурам: сукно, стекло, литьё. Гражданская промышленность растёт под покровительством короны, а не казны."
 MOL_mon_habs_academy: "Академия двора"
 MOL_mon_habs_academy_desc: "Придворная академия собирает инженеров, юристов и врачей со всех владений дома. Наука двора питает и армию, и мануфактуры."
 MOL_mon_habs_marriages: "Династические браки"
 MOL_mon_habs_marriages_desc: "Браки молдавской ветви дома с австрийскими и венгерскими линиями скрепляют союзы крепче любых договоров. Родство открывает двери, закрытые для дипломатов."
 MOL_mon_habs_guarantees: "Сеть гарантий"
 MOL_mon_habs_guarantees_desc: "Двор гарантирует малые страны Балкан: их безопасность — залог нашей торговли и престижа. Под защитой двора они держатся увереннее, а мы получаем право голоса в их делах."
 MOL_mon_habs_danube_flotilla: "Дунайская флотилия"
 MOL_mon_habs_danube_flotilla_desc: "Мониторы и сторожевые катера под флагом двора охраняют устья и переправы. Флотилия мала, но Дунай и Днестр без неё не удержать."
 MOL_mon_habs_army_corps: "Армейский корпус двора"
 MOL_mon_habs_army_corps_desc: "Полки двора сводятся в корпус с собственным штабом и школой офицеров. Доктрина корпуса сочетает австрийскую муштру и молдавскую смекалку."
 MOL_mon_habs_danubian_empire: "Соединённые Королевства Дуная"
 MOL_mon_habs_danubian_empire_desc: "Династия скрепляет Дунай и Балканы в составную монархию: каждое королевство хранит свой сейм, но корона, армия и внешняя политика — общие. Империя дворов, а не народов."
 MOL_mon_romanov_white_army: "Белая армия"
 MOL_mon_romanov_white_army_desc: "Офицеры и юнкера, прошедшие гражданскую войну, составляют костяк императорской армии. Дисциплина и опыт дорогого стоят — и дорого обходятся казне."
 MOL_mon_romanov_third_rome: "Третий Рим"
 MOL_mon_romanov_third_rome_desc: "Кишинёвский двор провозглашает себя хранителем православной державности. Вера и монархия сливаются: народ видит в государе не политика, а помазанника."
 MOL_mon_romanov_cossacks: "Казачьи войска"
 MOL_mon_romanov_cossacks_desc: "Казачьи станицы эмиграции получают земли и жалованье за службу. Конные сотни несут дозор и рейды — то, чего не умеет регулярная пехота."
 MOL_mon_romanov_war_industry: "Военные заводы двора"
 MOL_mon_romanov_war_industry_desc: "Императорская ветвь ставит промышленность на военные рельсы: патроны, снаряды, обмундирование. Двор в изгнании готовится к большой войне."
 MOL_mon_romanov_black_sea_fleet: "Черноморская флотилия"
 MOL_mon_romanov_black_sea_fleet_desc: "Верфи Измаила закладывают мониторы и миноносцы будущего императорского флота. Чёрное море — ворота, которые двор намерен держать за собой."
 MOL_mon_romanov_orthodoxy: "Соборное возрождение"
 MOL_mon_romanov_orthodoxy_desc: "Монастыри и приходы получают земли и пожертвования двора. Церковь молится за государя и приводит под его знамёна тех, кого не достигли указы."
 MOL_mon_romanov_imperial_throne: "Всероссийский престол"
 MOL_mon_romanov_imperial_throne_desc: "Молдавский двор принимает императорскую корону: Кишинёв становится столицей престола в изгнании. Армия, казачество и вера собраны под одним знаменем — знаменем империи, которая ещё вернётся."

 # ==================== ЗЕЛЁНАЯ ВЕТКА v3: восстания и пути Романовых ====================
 MOL_mon_native_uprising: "Земское восстание на Днестре"
 MOL_mon_native_uprising_desc: "Левый берег Днестра населён молдаванами, которых держава не спрашивала о вере и языке. Земские эмиссары готовят восстание: когда оно вспыхнет, Приднестровье встанет под знамёна господарства."
 MOL_mon_native_agents: "Земская агентура за Днестром"
 MOL_mon_native_agents_desc: "Старосты, священники и учителя левого берега становятся нашей сетью. Их донесения точны, а ячейки скрыты до часа восстания."
 MOL_mon_native_volunteers: "Добровольцы господарства"
 MOL_mon_native_volunteers_desc: "С берегов Прута на левый берег идут добровольцы и обозы с винтовками. Восстание получит людей и оружие, а господарство — ветеранов после победы."
 MOL_mon_native_reunion: "Воссоединение берегов"
 MOL_mon_native_reunion_desc: "Приднестровье, отстоявшее свою республику, добровольно входит в господарство. Днестр снова внутренняя река, а не граница."
 MOL_mon_romanov_allied_path: "Союзнический путь"
 MOL_mon_romanov_allied_path_desc: "Двор ставит на Антанту: Лондон и Париж признают императорские претензии в обмен на гарантии и рынки. Медленнее, но с тылом из великих держав."
 MOL_mon_romanov_german_path: "Прогерманский путь"
 MOL_mon_romanov_german_path_desc: "Берлин готов вооружать любого врага Москвы. Двор принимает немецкие винтовки, лицензии и инструкторов — цена: зависимость от рейхсвера."
 MOL_mon_romanov_autocracy: "Самодержавие без хозяев"
 MOL_mon_romanov_autocracy_desc: "Императорский двор не кланяется ни Лондону, ни Берлину: вся власть короне, опора — церковь и войско. Управление жёстче, но никто не указывает извне."
 MOL_mon_romanov_entente: "Гарантии Антанты"
 MOL_mon_romanov_entente_desc: "Двор гарантирует малые демократии Средиземноморья и Балкан, покупая их голос в пользу императорского дела. Сеть гарантий — щит от московских претензий."
 MOL_mon_romanov_allied_aid: "Союзнические поставки"
 MOL_mon_romanov_allied_aid_desc: "Через Константинополь и Марсель идут винтовки, обмундирование и кредиты двору. Эмиграция вооружается за счёт союзников, а не казны."
 MOL_mon_romanov_allied_corps: "Экспедиционный корпус"
 MOL_mon_romanov_allied_corps_desc: "Офицеры двора проходят школу при штабах Антанты: корпус эмиграции получает доктрину и выправку регулярной армии великих держав."
 MOL_mon_romanov_berlin_pact: "Соглашение с Берлином"
 MOL_mon_romanov_berlin_pact_desc: "Двор и рейхсвер обмениваются признанием и поставками. Немцы получают плацдарм против Москвы, двор — оружие и золото."
 MOL_mon_romanov_german_arms: "Немецкие винтовки"
 MOL_mon_romanov_german_arms_desc: "Эшелоны с маузерами и пулемётами разгружаются в Кишинёве. Армия эмиграции вооружена по немецким табелям."
 MOL_mon_romanov_german_officers: "Немецкие инструкторы"
 MOL_mon_romanov_german_officers_desc: "Офицеры рейхсвера ставят муштру и штабную работу двору. Организация войск растёт, но часть командиров смотрит на Берлин чаще, чем на корону."
 MOL_mon_romanov_uprising: "Восстание царских лоялистов"
 MOL_mon_romanov_uprising_desc: "На левом берегу Днестра живут семьи офицеров и чиновников прежней империи. Двор поднимает их под императорскими знамёнами: республика, которая возникнет там, будет процарской."
 MOL_mon_romanov_agents: "Императорская агентура"
 MOL_mon_romanov_agents_desc: "Офицеры-подпольщики и старые чиновники держат сеть за Днестром. Их донесения лягут в основу часов восстания."
 MOL_mon_romanov_volunteers: "Добровольцы эмиграции"
 MOL_mon_romanov_volunteers_desc: "Юнкера и казаки эмиграции идут на левый берег с винтовками двора. Восстание получит кадровое ядро, а двор — преданную гвардию."
 MOL_mon_romanov_reunion: "Воссоединение под императорским знаменем"
 MOL_mon_romanov_reunion_desc: "Процарская приднестровская республика, отстояв себя, передаёт себя под руку государя. Днестр становится внутренней рекой империи в изгнании."
 MOL_mon_romanov_war_ussr: "Поход на Москву"
 MOL_mon_romanov_war_ussr_desc: "Единственная и неизбежная война двора: Советский Союз держит земли прежней империи и не признаёт корону. Цели войны — Одесса, Херсон, Николаев и Крым. Дальше только поход."
