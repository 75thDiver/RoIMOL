l_russian:
 MOL_army_effort: "Развитие армии"
 MOL_army_effort_desc: "Несмотря на все новые возможности ведения боевых действий на море и в воздухе, сухопутные войска остаются ключевым элементом войны. При должной подготовке мы сумеем избежать прежнего ада в траншеях."
 MOL_equipment_effort: "Развитие снаряжения"
 MOL_equipment_effort_desc: "Есть предел тому, какой вес может нести на себе пехотинец. Мы сосредоточим все усилия на том, чтобы обеспечить войска самым лучшим снаряжением."
 MOL_motorization_effort: "Развитие транспорта"
 MOL_motorization_effort_desc: "Основные характеристики транспортных средств пехоты — маневренность и защищенность. Сосредоточившись на развитии этого направления, мы сможем быстрее бросать войска в бой."
 MOL_doctrine_effort: "Развитие доктрины"
 MOL_doctrine_effort_desc: "Военные доктрины Великой войны, определявшие методы ведения наземного боя, безнадежно устарели. Наши лучшие умы должны разработать новую тактику и стратегию."
 MOL_equipment_effort_2: "Развитие снаряжения II"
 MOL_equipment_effort_2_desc: "Мы будем и дальше прилагать все усилия к тому, чтобы наша пехота и войска поддержки были обеспечены наилучшим образом."
 MOL_mechanization_effort: "Развитие механизации"
 MOL_mechanization_effort_desc: "Всесторонне развивая моторизированную пехоту, мы научимся создавать самые совершенные транспортные средства."
 MOL_doctrine_effort_2: "Развитие доктрины II"
 MOL_doctrine_effort_2_desc: "Представление о ведении боевых действий изменилось не только за период между мировыми войнами, но и в ходе недавних конфликтов. Мы должны постоянно совершенствовать свою доктрину с учетом нового опыта."
 MOL_equipment_effort_3: "Развитие снаряжения III"
 MOL_equipment_effort_3_desc: "Хватит копировать чужие образцы и закупать снаряжение за рубежом! Мы должны стать ведущим мировым производителем пехотного оружия."
 MOL_armor_effort: "Развитие бронетехники"
 MOL_armor_effort_desc: "Применив знания, полученные в ходе моторизации нашей пехоты, мы также можем усовершенствовать бронетехнику."
 MOL_special_forces: "Войска специального назначения"
 MOL_special_forces_desc: "Нам необходимы элитные войска; приоритетной задачей должно стать создание горно-стрелковых и воздушно-десантных подразделений."
 MOL_aviation_effort: "Развитие авиации"
 MOL_aviation_effort_tt: "Недостаточно стройплощадок для §Yавиабаз§!"
 MOL_aviation_effort_desc: "Война в воздухе — это направление, где научно-технический прогресс идет стремительными темпами. Любая современная держава обязана развивать авиацию."
 MOL_fighter_focus: "Ставка на истребители"
 MOL_fighter_focus_desc: "Великая война научила нас маневренному воздушному бою, но это было только начало. Чтобы сохранить преимущество в будущем, мы должны создавать самые современные истребители."
 MOL_bomber_focus: "Ставка на бомбардировщики"
 MOL_bomber_focus_desc: "Когда люди будущего станут говорить об ужасах сегодняшних войн, они вспомнят огонь, падающий с неба. Мы должны сделать все для того, чтобы такие воспоминания остались только у наших врагов."
 MOL_aviation_effort_2: "Развитие авиации II"
 MOL_aviation_effort_2_desc: "Необходимо совершенствовать военно-воздушные силы, чтобы координировать их действия с другими родами войск."
 MOL_CAS_effort: "Развитие штурмовиков"
 MOL_CAS_effort_desc: "Современная армия нуждается в поддержке не только на земле, но и в воздухе."
 MOL_rocket_effort: "Развитие ракет"
 MOL_rocket_effort_desc: "Ракеты и реактивные двигатели позволяют пилотируемым и беспилотным летательным аппаратам достигать очень высоких скоростей. Прогресс в этой области даст нам возможность заставать врага врасплох."
 MOL_NAV_effort: "Развитие аэронавигации"
 MOL_NAV_effort_desc: "В новые времена война на море ведется и под водой, и в воздухе над водной поверхностью."
 MOL_naval_effort: "Развитие военно-морского флота"
 MOL_naval_effort_tt: "Недостаточно стройплощадок для §Yверфей§!"
 MOL_naval_effort_desc: "Развитие флота должно стать для нас приоритетной задачей. Нужно направить все доступные ресурсы на строительство новых верфей и развитие легких надводных кораблей."
 GER_MOL_naval_effort2: "Расширение верфей"
 GER_MOL_naval_effort2_desc: "Чтобы вернуть себе достойный флот, мы должны сперва значительно расширить наши кораблестроительные мощности."
 GER_MOL_naval_effort2_tt: "Строит §Y2 верфи§! в §Y2§! прибрежных регионах, контролируемых государством §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 MOL_flexible_navy: "ВМФ на основе многоцелевых судов"
 MOL_flexible_navy_desc: "Новая тактика ведения войны на море с учетом применения подводных лодок позволит эффективнее наносить удары по вражеским конвоям."
 MOL_large_navy: "ВМФ на основе крупных судов"
 MOL_large_navy_desc: "Включение крупных судов в нашу доктрину морской войны и обеспечение безопасности торговых конвоев покажет, какие типы кораблей нам нужнее всего."
 MOL_submarine_effort: "Развитие подводных лодок"
 MOL_submarine_effort_desc: "Война с использованием субмарин стала особенно перспективным направлением с момента появления торпедных катеров. Нам нужно научиться не только защищаться от подлодок противника, но и использовать их против вражеских кораблей."
 MOL_cruiser_effort: "Развитие крейсеров"
 MOL_cruiser_effort_desc: "Прежде чем заниматься продвинутыми разработками линкоров, нам нужно заменить устаревшие крейсеры."
 MOL_destroyer_effort: "Развитие эсминцев"
 MOL_destroyer_effort_desc: "Конструируя подводные лодки и изучая методы их применения, мы научимся противостоять данной тактике ведения боя. Эсминцы для этого жизненно необходимы."
 MOL_capital_ships_effort: "Развитие крупных кораблей"
 MOL_capital_ships_effort_desc: "Держава, обладающая самым крупным флотом, будет править морями. Линкоры и авианосцы представляют старый и новый подходы к концепции господства на море."
 MOL_industrial_effort: "Развитие промышленности"
 MOL_industrial_effort_desc: "Все политические усилия следует сосредоточить на том, чтобы обеспечить развитие промышленности мирного назначения."
 MOL_industrial_effort_2: "Развитие промышленности II"
 MOL_industrial_effort_2_desc: "Стальная воля и всенародный трудовой подъем помогут нам собрать силы для нового промышленного прорыва."
 MOL_construction_effort: "Развитие строительства"
 MOL_construction_effort_tt: "Недостаточно стройплощадок для §Yфабрик§!"
 MOL_construction_effort_desc: "Не следует недооценивать гражданскую промышленность, даже когда надвигается мировая война."
 MOL_production_effort: "Развитие вооружений"
 MOL_production_effort_tt: "Недостаточно стройплощадок для §Yвоенных заводов§!"
 MOL_production_effort_desc: "Кто умеет делать трактора, сумеет делать и танки! Мы не можем допустить отставание военной промышленности."
 MOL_construction_effort_2: "Развитие строительства II"
 MOL_construction_effort_2_desc: "Мы должны усовершенствовать фабрики, чтобы ускорить производство товаров для торговли и обеспечить дальнейшее строительство."
 MOL_production_effort_2: "Развитие вооружений II"
 MOL_production_effort_2_desc: "Не стоит пытаться переориентировать фабрики на выпуск военной продукции. Мы должны сосредоточиться на развитии военной промышленности как таковой."
 MOL_production_effort_3: "Развитие вооружений III"
 MOL_production_effort_3_desc: "Необходимо и дальше совершенствовать военные заводы для производства самой современной военной техники."
 MOL_infrastructure_effort: "Развитие инфраструктуры"
 MOL_infrastructure_effort_desc: "Страна без соответствующей инфраструктуры не может заниматься продвинутыми исследованиями и строительством."
 MOL_infrastructure_effort_tt: "Недостаточно стройплощадок для §Yинфраструктуры§!"
 synth_oil_effort_tt: "Недостаточно стройплощадок для §Yнефтеперерабатывающих заводов§!"
 MOL_infrastructure_effort_2: "Развитие инфраструктуры II"
 MOL_infrastructure_effort_2_desc: "Необходимо расширять инфраструктуру, развивая транспорт и средства связи для работы над высокотехнологичными секретными проектами."
 MOL_construction_effort_3: "Развитие строительства III"
 MOL_construction_effort_3_desc: "Расширение нашей инфраструктуры открыло для нас новые возможности в строительной сфере."
 MOL_nuclear_effort: "Развитие атомной энергетики"
 MOL_nuclear_effort_desc: "Мы стоим на пороге открытия, способного изменить мир. Нельзя допустить, чтобы наши противники запалили огонь, способный уничтожить Землю."
 MOL_extra_tech_slot: "Доп. ячейка для исследований"
 MOL_extra_tech_slot_desc: "Развитие промышленности и другие открытия последнего времени позволяют нам вести параллельные научно-технические исследования."
 MOL_extra_tech_slot_2: "Доп. ячейка для исследований II"
 MOL_extra_tech_slot_2_desc: "Быстрая индустриализация нашей страны открыла новые возможности для технических исследований, которыми нам стоит воспользоваться."
 MOL_technology_sharing: "Обмен технологиями"
 MOL_technology_sharing_desc: "Обмен новейшими технологиями с союзниками повысит эффективность военно-научных исследований всего нашего альянса."
 MOL_secret_weapons: "Секретное оружие"
 MOL_secret_weapons_desc: "Направить все свободные ресурсы на строительство танков и самолетов — это заманчиво, однако победу в войне способны обеспечить лишь новейшие научные направления: электроника, ракетостроение и атомная энергетика."
 
 MOL_political_effort: "Бессарабская политика"
 MOL_political_effort_desc: "После десятилетий противоречий, наше общество стоит на пороге перемен. Нам предстоит решать не только политические вопросы, но и вопросы идентичности, памяти и культуры. \nИ самое главное:\nМы румыны или всё таки молдаване?"
 
 MOL_we_are_romanians: "Мы румыны!"
 MOL_we_are_romanians_desc: "Нас пытаются убедить, что мы другие, что у нас отдельный путь. Но истина проста: мы — румыны. Наш язык, наша кровь и наша история — едины.\nМЫ РУМЫНЫ!"
 
 MOL_bessarabia: "Бессарабия"
 MOL_bessarabia_desc: "В Бессарабии нет раздора — здесь царит спокойствие и вера в королевство. Мы такие же румыны, как и в Валахии или Трансильвании."
 MOL_bessarabia_reform: "Местные инициативы"
 MOL_bessarabia_reform_desc: "Бухарест доверяет бессарабским регионам, мы доказали свою лояльность. Благодаря этому доверию регионы Бессарабии могут развивать собственные проекты в рамках национальной политики."
 MOL_bessarabia_reform_industry: "Бессарабская индустрия"
 MOL_bessarabia_reform_industry_desc: "В каждом заклёпке нового цеха — вера в общее будущее. Индустриализация гражданского сектора Бессарабии — это наш вклад в будущее наших регионов и румынских граждан"
 MOL_bessarabia_reform_railways: "Бессарабская логистика"
 MOL_bessarabia_reform_railways_desc: "Инфраструктура — это не роскошь, а необходимость. Мы берёмся за модернизацию дорог и снабженческих узлов, чтобы Бессарабия больше не была оторвана от остальной страны."
 MOL_bessarabia_reform_resources: "Ископаемые Бессарабии"
 MOL_bessarabia_reform_resources_desc: "Геологические исследования подтвердили: под бессарабской землёй скрыты ключевые стратегические ресурсы. Их добыча станет новой вехой в развитии нашего региона."
 MOL_bessarabia_reform_regional_1: "Межбессарабские отношения"
 MOL_bessarabia_reform_regional_1_desc: "Налаживание сотрудничества между жудецами Бессарабии — ключ к эффективному управлению. Общие проекты, транспортные связи и обмен опытом укрепляют нашу историческую область."
 MOL_bessarabia_reform_regional_2: "Патриотизм в Бессарабии"
 MOL_bessarabia_reform_regional_2_desc: "Программа патриотического воспитания охватит школы, органы власти и культурные учреждения. Лояльность, честь и единство станут основой для сплочённого регионов Бессарабии."
 MOL_bessarabia_reform_regional_3: "Региональное единство"
 MOL_bessarabia_reform_regional_3_desc: "От Днестра до Дуная — мы едины! Мы Бессарабия! Мы Румыния!"
 MOL_bessarabia_reform_mil_factory: "Станки делают оружие солдатам"
 MOL_bessarabia_reform_mil_factory_desc: "Некоторые Бессарабские регионы полагают, что им необходимо начать делать оружие для румынской армии. Чем больше военных заводов, тем симльнее наша армия станет!"
 MOL_bessarabia_reform_manpower: "Солдаты защищают страну"
 MOL_bessarabia_reform_manpower_desc: "Бессарабия, как исторический регион, тесно связана с Румынией. Наш великий союз не должен быть разрушен! Именно по этой причине Бессарабские регионы пропагандируют собственному населению идею о защите родины, защите Румынии. А чтобы её защитить - нужно вступить в армию."
 MOL_bessarabia_reform_bunkers: "Бункеры защищают солдат"
 MOL_bessarabia_reform_bunkers_desc: "На недавнем съезде регионов Бессарабии было решено начать совместный межрегиональный проект под названием "Бессарабская линия". Цель проекта - защитить Бессарабию, румынский народ и саму Румынию от возможной угрозы с востока. Всё во благо страны, отечества и короля.\nTrăiască Regele!"
 MOL_bessarabian_tinut_focus: "Цинут Бессарабия"
 MOL_bessarabian_tinut_focus_desc: "Разрозненные жудецы Бессарабии недостаточно эффективны. Централизация в форме одного цинута обеспечит лучшее снабжение, координацию и стабильность в регионе."
 
 ROM_MOL_autonomy: "Может мы всё таки Молдова"
 ROM_MOL_autonomy_desc: "Делегаты со всех жудец готовы выдвинуться в Бухарест для предложения создания автономной Молдовы"
 ROM_MOL_autonomy_success: "Молдавская Автономия"
 ROM_MOL_autonomy_success_desc: "Мы добились своей цели и теперь можем иметь больше прав на свою землю"
 ROM_MOL_workers: "Рабочие из румынской Молдавии"
 ROM_MOL_workers_desc: "Румыния дала автономию только Бессарбской Молдаве, но не всей Молдавии. По этой причине Бессарабия и Западная Молдавия не являются едиными, но мы можем привлечь рабочих другой Молдовы к нам на заработки, начав путь унианизма"
 ROM_MOL_reform_industry_1: "Создаём рабочие места"
 ROM_MOL_reform_industry_1_desc: "Приехавшим западным молдаванам нужны рабочие места и мы обязаны их предоставить. Директорат уже издал приказ о построении двух крупных предприятий."
 ROM_MOL_reform_mining_1: "Развитие добывающих предприятий"
 ROM_MOL_reform_mining_1_desc: "Благодаря притоку новых рабочих рук, Молдавская автономия теперь может позволить себе открыть новые шахты, добывающие предприятия и прочее."
 ROM_MOL_new_cities: "Новые места"
 ROM_MOL_new_cities_desc: "Мы активно строим новые поселения из-за резкого роста востребовательности нашего региона. Люди толпами едут в Молдову работать на перспективной работе и просто в перспективе хорошей жизни. Несмотря на обеспокоиность центрального аппарата, мы построим новые города и поселения для переселенцев"
 ROM_MOL_reform_industry_2: "Наращиваем производство"
 ROM_MOL_reform_industry_2_desc: "В нашем регионе всё больше и больше новых лиц. Для достижения экономического чуда нам нужно ещё больше новых предприятий: как и коммерческих, так и государственных, чтобы использовать в свою пользу."
 ROM_MOL_reform_separate_army: "Особый статус в армии"
 ROM_MOL_reform_separate_army_desc: "Ещё одной особенностью нашей автономии должны стать отдельные подразделения со своим автономным управлением. Это позволит нам и нашим бойцам функционировать даже после коллапса, падения или разрыва связи с Бухарестом"
 ROM_MOL_economic_miracle: "Экономическое чудо"
 ROM_MOL_economic_miracle_desc: "Мы построили заводы и шахты, привлекли рабочих. Теперь пришло время сделать Молдову настоящей промышленной жемчужиной региона."
 ROM_MOL_autonomy_expansion: "Расширение автономии"
 ROM_MOL_autonomy_expansion_desc: "Получив собственную армию и управление, мы можем требовать ещё больше прав от Бухареста."
 ROM_MOL_moldavian_assembly: "Молдавское собрание"
 ROM_MOL_moldavian_assembly_desc: "Настало время созвать всех представителей молдавского народа и решить нашу судьбу раз и навсегда."
 ROM_MOL_moldovan_schools: "Молдавские школы"
 ROM_MOL_moldovan_schools_desc: "Наши дети должны учиться на родном языке. Открытие школ с молдавским языком обучения укрепит национальное самосознание, но Бухарест посмотрит на это косо."
 ROM_MOL_orthodox_church: "Автономия митрополии"
 ROM_MOL_orthodox_church_desc: "Церковь — душа народа. Добившись самостоятельности молдавской митрополии от румынского синода, мы получим мощную опору внутри региона."
 ROM_MOL_national_revival: "Национальное возрождение"
 ROM_MOL_national_revival_desc: "Песни, язык, обычаи и память предков — всё это просыпается в молдаванах. Бухарест тревожится, но народ уже не остановить."
 ROM_MOL_foreign_mission: "Собственная дипмиссия"
 ROM_MOL_foreign_mission_desc: "Пусть формально мы подчиняемся Бухаресту, но наши emissary начнут работать при дворах Европы. Мир должен узнать о Молдове как о самостоятельном субъекте."
 ROM_MOL_wine_diplomacy: "Винная дипломатия"
 ROM_MOL_wine_diplomacy_desc: "Наши вина известны от Парижа до Москвы. Экспорт вина принесёт казне доход и мягко откроет любые двери — даже те, что закрыты для дипломатов."
 ROM_MOL_border_guard: "Днестровская погранстража"
 ROM_MOL_border_guard_desc: "Восточная граница королевства проходит по Днестру. Кто лучше молдаван знает эти берега? Наши отдельные части возьмут границу под охрану — Бухарест это оценит."
 ROM_MOL_loyal_service: "Верная служба короне"
 ROM_MOL_loyal_service_desc: "Докажем делами, что Молдова — надёжная опора трона: поставим короне снаряжение и людей. За верность платят доверием и подарками."
 ROM_MOL_pressure_bucharest_desc: "Хватит просить — пора требовать. Делегация Собрания вручит Бухаресту меморандум о расширении прав. Риск велик, но только так добывают свободу."
 ROM_MOL_pressure_bucharest: "Давление на Бухарест"
 ROM_MOL_loyal_service_tt: "§GДоверие Бухареста значительно вырастет§!"

 MOL_we_are_romania: "Мы — Румыния"
 MOL_we_are_romania_desc: "История, культура и кровь неразрывно связывают нас с Румынией. Бессарабия — это не просто регион, это часть великого румынского мира. Пришло время признать это открыто и навсегда связать нашу судьбу с Бухарестом. Trăiască România Mare!"
 MOL_greater_moldavia: "Великая Молдавия"
 MOL_greater_moldavia_desc: "Настало время завершить начатое. Молдавская автономия обратится к Бухаресту с предложением объединить все молдавские земли под единой короной. Будущее нашего народа — в единой и неделимой Румынии!"
 MOL_transnistria_fire: "Транснистрия в огне"
 MOL_transnistria_fire_desc: "Приднестровье — исконная молдавская земля, отторгнутая большевиками. Настало время поднять восстание среди местного населения и вернуть регион в лоно родины. Огонь освобождения охватит берега Днестра!"
 MOL_internal_affairs: "Заняться внутренними делами"
 MOL_internal_affairs_desc: "Вместо того чтобы разжигать конфликты на границах, мы должны сосредоточиться на решении проблем меньшинств и укреплении единства внутри страны. Южная Одесса должна признать свою принадлежность к молдавской культуре."

  # === Ветка "Мы молдоване!" ===
 MOL_we_are_moldovans: "Мы молдоване!"
 MOL_we_are_moldovans_desc: "Хватит притворяться! Наша культура, наш язык и наша история отличаются от румынских. Мы — молдоване, и мы больше не хотим быть просто провинцией Бухареста. Пришло время бороться за свою идентичность."
 MOL_prep_red: "Красные ячейки"
 MOL_prep_red_desc: "Коммунистическое подполье готовит забастовки и ячейки сопротивления. Их дисциплина и связи с рабочими станут нашей силой в час войны."
 MOL_prep_blue: "Подпольный Сфатул Цэрий"
 MOL_prep_blue_desc: "Демократические деятели готовят легальную сеть советов и печать. Их связи с западными державами придадут нашему делу вес."
 MOL_prep_green: "Хайдучество и традиционалисты"
 MOL_prep_green_desc: "Старые роды, хайдучьи отряды и церковные братства — опора традиционной Молдовы. Они не умеют строевой, но умеют выживать и бить из засад."
 MOL_underground_militias: "Подпольные ополчения"
 MOL_underground_militias_desc: "Пока Бухарест спит, в лесах и подвалах Бессарабии куётся наша свобода. Мы начинаем тайно формировать отряды самообороны и накапливать оружие."
 MOL_partisan_networks: "Партизанские сети"
 MOL_partisan_networks_desc: "Мы создадим разветвлённую сеть подпольных ячеек. Если Румыния попытается применить силу, она увязнет в бесконечной партизанской войне на каждой улице наших городов."
 MOL_seek_foreign_aid: "Поиск иностранной поддержки"
 MOL_seek_foreign_aid_desc: "Нам нужны союзники на международной арене. Мы должны показать миру, что Бессарабия — не румынская земля, а угнетённый регион, нуждающийся в поддержке."
 MOL_smuggle_weapons: "Контрабанда оружия"
 MOL_smuggle_weapons_desc: "Оружие поступает через границу тайными тропами. Каждая винтовка — шаг к свободе."
 MOL_point_of_no_return: "Точка невозврата"
 MOL_point_of_no_return_desc: "Мы зашли слишком далеко. Назад пути нет. Мы предъявим Бухаресту ультиматум: либо они признают нашу независимость мирно, либо мы завоюем её с оружием в руках."

 # === Сторона "Красные" — подфокусы ===
 MOL_red_cells: "Рабочие отряды"
 MOL_red_cells_desc: "Заводские коллективы формируют боевые дружины. Классовая солидарность превращается в организованную силу."
 MOL_red_agitators: "Агитаторы казарм и цехов"
 MOL_red_agitators_desc: "Наши люди ведут тихую работу среди солдат и рабочих. Когда придёт час, целые подразделения откажутся стрелять в народ."

 # === Сторона "Синие" — подфокусы ===
 MOL_blue_councils: "Земские советы"
 MOL_blue_councils_desc: "Местные советы берут на себя управление общинами. Легальная структура будущей государственности растёт снизу."
 MOL_blue_arms: "Внешние каналы снабжения"
 MOL_blue_arms_desc: "Через дружественные миссии и торговые дома мы приобретаем оружие и снаряжение для будущей армии."

 # === Сторона "Зелёные" — подфокусы ===
 MOL_green_haiduks: "Хайдучьи сотни"
 MOL_green_haiduks_desc: "Лесные отряды хайдуков собираются под старые знамёна. Их опыт засад и рейдов бесценен для будущей войны."
 MOL_green_church: "Церковные братства"
 MOL_green_church_desc: "Приходские братства дают повстанцам укрытие, снабжение и моральную опору. Вера крепит народ сильнее штыков."

 # === Подветка А: Наследие приднестровского похода ===
 MOL_transnistria_agents: "Агентурная сеть за Днестром"
 MOL_transnistria_agents_desc: "Наши люди внедрены в администрации и гарнизоны Приднестровья. Их донесения сделают будущие действия точными и своевременными."
 MOL_transnistria_volunteers: "Добровольцы восстания"
 MOL_transnistria_volunteers_desc: "Беженцы и добровольцы с левого берега вливаются в наши ряды, принося с собой оружие и ненависть к оккупационным порядкам."
 MOL_transnistria_aftermath: "Воссоединение берегов"
 MOL_transnistria_aftermath_desc: "Восстание свершилось. Приднестровье вновь с нами: семьи возвращаются, фабрики запускаются, а Днестр снова становится внутренней рекой, а не границей."

 # === Подветка Б: Внутренние дела и единство ===
 MOL_minority_rights: "Права меньшинств"
 MOL_minority_rights_desc: "Гагаузы, болгары, украинцы, русские — все они называют Бессарабию домом. Равные права и уважение к языкам сделают их нашими союзниками, а не проблемой."
 MOL_gagauz_autonomy: "Гагаузская автономия"
 MOL_gagauz_autonomy_desc: "Степные общины Буджака получают самоуправление и поддержку инфраструктуры. Лояльность юга стоит этих затрат."
 MOL_economic_integration: "Экономическая интеграция"
 MOL_economic_integration_desc: "Единый рынок, общие дороги и связанная промышленность превращают разрозненные жудецы в единое экономическое тело страны."

 # ==================== ПОБЕДА И ВЫБОРЫ ====================
 MOL_victory: "Победа!"
 MOL_victory_desc: "Мы выстояли! Румыния признала нашу независимость и подписала белый мир. Теперь перед нами открыт путь к строительству нового государства. Но какой будет наша Молдова? Это решат предстоящие выборы."

 # ==================== КРАСНАЯ ВЕТКА (ПЕРЕРАБОТАНА) ====================
 MOL_red_government: "Красное правительство"
 MOL_red_government_desc: "Коммунистическая партия одержала убедительную победу на выборах. Рабочие и крестьяне доверили нам строить новое социалистическое общество. Но какой путь мы выберем — под крылом Москвы или самостоятельно?"
 MOL_red_consolidation: "Консолидация власти"
 MOL_red_consolidation_desc: "Прежде чем строить социализм, нужно убедиться, что враги революции не подорвут нас изнутри. Секуритате возьмёт под контроль все контрреволюционные элементы."
 MOL_red_soviet_alignment: "Союз с Москвой"
 MOL_red_soviet_alignment_desc: "Советский Союз — наш естественный союзник и образец для подражания. Сблизившись с Москвой, мы получим мощную поддержку и защиту от империалистических угроз."
 MOL_red_independent_path: "Самостоятельный путь"
 MOL_red_independent_path_desc: "Мы построим социализм по-молдавски! Без указки из Москвы, без слепого копирования чужих моделей. Наша революция — наша дорога, как у Тито в Югославии."
 MOL_red_comintern: "Вступление в Коминтерн"
 MOL_red_comintern_desc: "Идеологическое сближение с Коммунистическим Интернационалом укрепит наши связи с братскими партиями. Мы получим политическую поддержку и экономическую помощь от СССР, но сохраним возможность выбора собственного пути. Это не вступление в советский блок — это солидарность мирового пролетариата."
 MOL_red_soviet_advisors: "Советские военные советники"
 MOL_red_soviet_advisors_desc: "Красные командиры делятся боевым опытом с нашей армией. Мы перенимаем лучшие практики Красной Армии — от тактики до стратегии."
 MOL_red_soviet_industrial_aid: "Советская промышленная помощь"
 MOL_red_soviet_industrial_aid_desc: "Москва присылает инженеров, оборудование и чертежи. Наши заводы модернизируются по советским стандартам."
 MOL_red_collectivization: "Коллективизация"
 MOL_red_collectivization_desc: "Частные хозяйства будут объединены в колхозы. Это тяжёлый шаг, но он обеспечит продовольственную безопасность и высвободит рабочих для заводов."
 MOL_red_soviet_research_cooperation: "Научное сотрудничество с СССР"
 MOL_red_soviet_research_cooperation_desc: "Советские учёные делятся с нами последними разработками. Вместе мы быстрее продвинемся вперёд."
 MOL_red_claims: "Территориальные претензии к Румынии"
 MOL_red_claims_desc: "Бессарабия и Южная Бессарабия — исконные молдавские земли, отторгнутые Румынией в 1918 году. Советская поддержка делает наши претензии реальными. Мы предъявим ультиматум Бухаресту и вернём свои территории силой, если понадобится."
 MOL_red_fortress: "Днестровский оборонительный рубеж"
 MOL_red_fortress_desc: "На восточной границе мы возведём мощную линию укреплений. Ни один враг не пройдёт через нашу крепость."
 MOL_red_join_soviet_union: "Запрос на вхождение в СССР"
 MOL_red_join_soviet_union_desc: "Направим в Москву официальный запрос о вхождении Молдавской ССР в состав Советского Союза. Если Кремль согласится, мы получим статус союзной республики и мощную поддержку. Если откажет — продолжим строить социализм самостоятельно. Решение за Москвой."
 MOL_red_join_soviet_union_tt: "Отправит §Yзапрос§! в §YСССР§! о вхождении в состав.\nЕсли Москва §Gпримет§!, Молдова станет §YМолдавской ССР§! (марионетка СССР).\nЕсли §Rотклонит§!, мы получим утешительный бонус и продолжим самостоятельный путь."

 # --- Самостоятельная ветка ---
 MOL_red_workers_self_management: "Рабочее самоуправление"
 MOL_red_workers_self_management_desc: "Каждый завод — собственность трудового коллектива. Рабочие сами решают, как производить и распределять. Это и есть настоящий социализм."
 MOL_red_market_socialism: "Рыночный социализм"
 MOL_red_market_socialism_desc: "Предприятия принадлежат рабочим, но рынок определяет цены. Гибридная модель сочетает свободу и справедливость — как в Югославии Тито."
 MOL_red_command_economy: "Командная экономика"
 MOL_red_command_economy_desc: "Государственный план определяет всё: что производить, кому продавать, сколько платить. Максимальная мобилизация ресурсов для строительства социализма."
 MOL_red_independent_trade_policy: "Независимая торговля"
 MOL_red_independent_trade_policy_desc: "Мы торгуем со всеми — и с социалистами, и с капиталистами. Прагматизм выше идеологии. Это раздражает Москву, но обогащает Молдову."
 MOL_red_trade_with_ussr: "Торговля с СССР"
 MOL_red_trade_with_ussr_desc: "Несмотря на самостоятельность, мы сохраняем тесные экономические связи с Советским Союзом. Взаимная выгода выше политических разногласий."
 MOL_red_nationalize_industry: "Национализация промышленности"
 MOL_red_nationalize_industry_desc: "Все крупные предприятия переходят в собственность народа. Буржуазия лишается экономической базы, а рабочие получают хозяина — самих себя."
 MOL_red_five_year_plan: "Пятилетка"
 MOL_red_five_year_plan_desc: "Мы разработаем собственный план индустриализации. Каждый завод, каждая дорога — шаг к социалистическому изобилию по-молдавски."
 MOL_red_establish_securitate: "Создание Секуритате"
 MOL_red_establish_securitate_desc: "Тайная полиция охраняет революцию от внутренних врагов. Ни один контрреволюционер не уйдёт от правосудия."
 MOL_red_purge_opposition: "Чистка оппозиции"
 MOL_red_purge_opposition_desc: "Демократы, монархисты, фашисты — все они враги народа. Секуритате нейтрализует их быстро и беспощадно."
 MOL_red_collectivization_indep: "Коллективизация"
 MOL_red_collectivization_indep_desc: "Частные хозяйства объединяются в колхозы по нашему, молдавскому образцу. Не сталинскому, но эффективному."
 MOL_red_army_reform_indep: "Реформа армии"
 MOL_red_army_reform_indep_desc: "Армия нового типа: дисциплинированная, идеологически закалённая, готовая защищать революцию и наш самостоятельный путь."
 MOL_red_militia_forces: "Народное ополчение"
 MOL_red_militia_forces_desc: "Вместо профессиональной армии мы создадим народное ополчение. Каждый рабочий — солдат, каждая фабрика — арсенал."
 MOL_red_partisan_warfare: "Партизанская война"
 MOL_red_partisan_warfare_desc: "Наш опыт подпольной борьбы против Румынии стал основой военной доктрины. Если враг оккупирует нас — он утонет в партизанской войне."

 # --- Экспорт революции ---
 MOL_red_spread_revolution: "Экспорт революции"
 MOL_red_spread_revolution_desc: "Нам не страшен мир капитала — мы его изменим! Революция должна выйти за границы Молдовы и охватить весь мир."
 MOL_red_international_brigades: "Интернациональные бригады"
 MOL_red_international_brigades_desc: "Добровольцы со всего мира стекаются под наши красные знамёна. Мы отправим их туда, где нужна помощь братским партиям."
 MOL_red_call_for_socialist_help: "Призыв к социалистической помощи"
 MOL_red_call_for_socialist_help_desc: "Когда враг у наших ворот, мы обращаемся к братским коммунистическим странам. Мировая солидарность пролетариата — наша сила."
 MOL_red_balkan_communist_federation: "Балканская Коммунистическая Федерация"
 MOL_red_balkan_communist_federation_desc: "Вместо вступления в советский блок, мы создадим собственную федерацию балканских социалистических республик! Молдова — лидер нового союза."
 MOL_red_work_with_revolutionary_orgs: "Работа с революционными организациями"
 MOL_red_work_with_revolutionary_orgs_desc: "Наши агитаторы ведут работу в Румынии, Болгарии и Греции, готовя почву для братских революций."
 MOL_red_influence_romania: "Революция в Румынии"
 MOL_red_influence_romania_desc: "Наши бывшие угнетатели должны сами стать свободными. Коммунистическая пропаганда охватит Бухарест и всю Румынию."
 MOL_red_influence_bulgaria: "Революция в Болгарии"
 MOL_red_influence_bulgaria_desc: "Болгарские товарищи давно ждут поддержки. Мы протянем им руку и поможем свергнуть монархию."
 MOL_red_influence_greece: "Революция в Греции"
 MOL_red_influence_greece_desc: "Греческие коммунисты ведут гражданскую войну. Наша помощь может переломить ход истории."
 MOL_red_economic_integration: "Экономическая интеграция Балкан"
 MOL_red_economic_integration_desc: "Единый рынок, общая валюта, скоординированное планирование. Балканы становятся единым экономическим пространством."
 MOL_red_political_integration: "Политическая интеграция Балкан"
 MOL_red_political_integration_desc: "Общие политические институты сближают балканские народы. Скоро границы останутся только на картах."
 MOL_red_military_integration: "Военная интеграция Балкан"
 MOL_red_military_integration_desc: "Единое командование, общие стандарты обучения, скоординированная оборона. Балканская Красная Армия рождается."
 MOL_red_unification_of_balkans: "Объединение Балкан"
 MOL_red_unification_of_balkans_desc: "Исторический момент! Все балканские социалистические республики объединяются в единое государство. Молдова — сердце нового союза."
 MOL_red_political_stabilization: "Политическая стабилизация"
 MOL_red_political_stabilization_desc: "Объединение стольких народов вызвало хаос. Необходимо время и усилия для стабилизации новой сверхдержавы."
 MOL_red_anti_fascist_coalition: "Антифашистская коалиция"
 MOL_red_anti_fascist_coalition_desc: "Фашизм — главный враг человечества. Мы создадим широкую коалицию всех прогрессивных сил для борьбы с ним."
 MOL_red_decrease_fascist_influence: "Борьба с фашистским влиянием"
 MOL_red_decrease_fascist_influence_desc: "Наши радиостанции и листовки несут правду о фашизме в соседние страны. Идеологическая борьба — первый шаг к победе."
 MOL_red_fight_capitalism: "Борьба с капитализмом"
 MOL_red_fight_capitalism_desc: "Капиталистические державы — пособники фашизма. Мы нанесём удар по их интересам и поддержим рабочие движения."
 MOL_red_destroy_reactionaries: "Уничтожение реакционеров"
 MOL_red_destroy_reactionaries_desc: "Монархии и консервативные режимы — пережитки прошлого. Их время ушло, и мы ускорим их падение."
 MOL_red_crush_fascism: "Разгром фашизма"
 MOL_red_crush_fascism_desc: "Фашистские режимы должны быть уничтожены. Мы создадим повод для войны и сметём их с лица земли."
 MOL_red_finish_fascism: "Окончательная победа над фашизмом"
 MOL_red_finish_fascism_desc: "Последние фашистские государства Европы трепещут. Мы сокрушим их и навсегда избавим мир от этой чумы."
 MOL_red_peoples_moldavia: "Народная Молдова"
 MOL_red_peoples_moldavia_desc: "Мы построили социализм, объединили Балканы, разгромили фашизм. Молдова — региональная сверхдержава и маяк мирового прогресса!"

 # --- Названия партий и косметические теги ---
 
 MOL_balkan_unification_cores_tt: "Все балканские государства, входящие в нашу федерацию, получат §Yнациональные ядра§!"
 MOL_balkan_communist_federation_tt: "Создаст фракцию §YБалканская Коммунистическая Федерация§! и пригласит все коммунистические балканские страны."
 MOL_balkan_communist_federation_decisions_tt: "Откроет §Yрешения§! для работы с балканскими революционными организациями."
 MOL_spawn_three_interbrigades_tt: "Создаст §Y3 интернациональных бригады§! (пехота, опыт 50%)."
 MOL_finish_fascism_tt: "Создаст §Yцели войны§! против всех крупных фашистских государств."
 MOL_trading_partner: "Торговый партнёр"
 MOL_trading_partner_less: "Снижение торговых отношений"
 MOL_favouritism_in_trading: "Предпочтение в торговле"
 MOL_trade_agreement: "Торговое соглашение"
 MOL_subversive_diplomacy: "Подрывная дипломатия"

 # ==================== РЕШЕНИЯ ====================
 MOL_communist_decisions_category: "Коммунистическая политика"
 MOL_communist_decisions_category_desc: "Решения для коммунистического правительства Молдовы: поддержка революций, индустриализация и укрепление власти."

 MOL_support_romania_revolution: "Поддержать революцию в Румынии"
 MOL_support_romania_revolution_desc: "Наши агитаторы активизируют работу в Румынии. Это дестабилизирует режим и укрепит позиции коммунистов."
 MOL_support_romania_revolution_tt: "§RРумыния§! потеряет §Y10%§! стабильности и получит §Y+15%§! популярности коммунизма."

 MOL_support_bulgaria_revolution: "Поддержать революцию в Болгарии"
 MOL_support_bulgaria_revolution_desc: "Болгарские товарищи получат нашу поддержку. Скоро София станет красной."
 MOL_support_bulgaria_revolution_tt: "§RБолгария§! потеряет §Y10%§! стабильности и получит §Y+15%§! популярности коммунизма."

 MOL_support_greece_revolution: "Поддержать революцию в Греции"
 MOL_support_greece_revolution_desc: "Греческие коммунисты получат оружие, деньги и идеологическую поддержку."
 MOL_support_greece_revolution_tt: "§RГреция§! потеряет §Y10%§! стабильности и получит §Y+15%§! популярности коммунизма."

 MOL_send_volunteers_to_greece: "Отправить добровольцев в Грецию"
 MOL_send_volunteers_to_greece_desc: "10 000 добровольцев и 2000 единиц оружия для греческих товарищей."
 MOL_send_volunteers_to_greece_tt: "Мы отправим §Y10 000§! человек и §Y2000§! ед. пехотного снаряжения греческим коммунистам."

 MOL_extra_five_year_plan: "Дополнительная пятилетка"
 MOL_extra_five_year_plan_desc: "Новый виток индустриализации: ещё один гражданский и один военный завод."
 MOL_extra_five_year_plan_tt: "Построит §Y1 гражданский§! и §Y1 военный§! завод в случайных контролируемых регионах."

 MOL_party_congress: "Партийный съезд"
 MOL_party_congress_desc: "Всенародный съезд Партии Коммунистов Молдовы укрепит единство и легитимность власти."
 MOL_party_congress_tt: "§Y+5%§! стабильности и §Y+10%§! популярности коммунизма."

 MOL_crackdown: "Подавить восстание"
 MOL_crackdown_desc: "Секуритате жёстко подавит любые проявления недовольства. Порядок любой ценой."
 MOL_crackdown_tt: "§Y+10%§! стабильности, но §Y-5%§! поддержки войны."

 # ==================== СИНЯЯ ВЕТКА (РАСШИРЕННАЯ) ====================
 MOL_dem_government: "Демократическое правительство"
 MOL_dem_government_desc: "Демократические силы победили на свободных выборах. Народ доверил нам построить современное европейское государство. Но какой путь мы выберем?"

 MOL_dem_stabilization: "Стабилизация республики"
 MOL_dem_stabilization_desc: "После войны и обретения независимости страна нуждается в стабильности. Мы заложим фундамент демократического государства: укрепим институты, обеспечим правопорядок и вернём доверие граждан к власти."

 # === ПРОСОЮЗНИЧЕСКИЙ ПУТЬ ===
 MOL_dem_allied_alignment: "Союз с державами Запада"
 MOL_dem_allied_alignment_desc: "Великобритания и Франция — гаранты демократического порядка в Европе. Сблизившись с ними, мы получим защиту от тоталитарных режимов и доступ к передовым технологиям."
 MOL_dem_anti_fascist_diplomacy: "Антифашистская дипломатия"
 MOL_dem_anti_fascist_diplomacy_desc: "Фашизм — угроза всему свободному миру. Мы открыто выступим против фашистских режимов и будем поддерживать демократические движения по всей Европе."
 MOL_dem_british_trade: "Торговля с Британией"
 MOL_dem_british_trade_desc: "Британская империя — крупнейший рынок мира. Свободная торговля с Лондоном принесёт экономический рост и укрепит наши связи."
 MOL_dem_british_military_mission: "Британская военная миссия"
 MOL_dem_british_military_mission_desc: "Британские офицеры помогут модернизировать нашу армию по стандартам НАТО. Современное снаряжение, обучение и доктрины сделают нас сильнее."
 MOL_dem_join_allies: "Вступление в Союзники"
 MOL_dem_join_allies_desc: "Мы официально вступаем в альянс западных демократий. Наша безопасность теперь гарантирована коллективной обороной."
 MOL_dem_guarantee_balkans: "Гарантии балканским демократиям"
 MOL_dem_guarantee_balkans_desc: "Мы гарантируем независимость всех демократических государств Балкан — кроме Румынии. Если кто-то нападёт на них, они получат нашу защиту."
 MOL_dem_french_support: "Поддержка Франции"
 MOL_dem_french_support_desc: "Франция — ещё один столп европейской демократии. Сближение с Парижем принесёт военную помощь и политическую поддержку."
 MOL_dem_ultimatum_romania: "Ультиматум Румынии"
 MOL_dem_ultimatum_romania_desc: "Бухарест должен выбрать: вернуть молдавские земли за Прутом — Молдавию и Буковину — и допустить демократическое правительство, либо получить войну. Если Румыния уже демократическая, ультиматум не понадобится: она сама может стать нашим партнёром."
 MOL_dem_romania_democratic_tt: "Если §YРумыния§! уже демократическая, мы предложим ей союз."
 MOL_dem_war_with_romania: "Война за Молдавию"
 MOL_dem_war_with_romania_desc: "Румыния отвергла ультиматум, и война уже идёт. Весь народ встаёт под ружьё: наши войска получают боевой дух в боях против Румынии — выше атака и оборона. Подъём длится полгода и держится, пока идут бои."
 MOL_dem_peaceful_romania: "Союз с демократической Румынией"
 MOL_dem_peaceful_romania_desc: "Румыния приняла наши условия: земли за Прутом возвращены, а правительство стало демократическим. Вместо войны мы предлагаем ей союз и дружбу. Вместе мы сильнее."
 MOL_dem_volunteers_for_democracy: "Добровольцы за демократию"
 MOL_dem_volunteers_for_democracy_desc: "Мы отправим добровольцев и оружие всем демократическим государствам, ведущим войну против тирании."
 MOL_dem_liberate_transnistria: "Освобождение Приднестровья"
 MOL_dem_liberate_transnistria_desc: "Приднестровье — исконная молдавская земля, оккупированная СССР. Мы потребуем его возвращения и, если понадобится, возьмём его силой."
 MOL_dem_war_with_soviet: "Война с СССР"
 MOL_dem_war_with_soviet_desc: "Советский Союз отказался вернуть Приднестровье. Мы объявляем войну и вернём наши земли. Запад поддержит нас."
 MOL_dem_victory_in_europe: "Победа в Европе"
 MOL_dem_victory_in_europe_desc: "Мы вернули все молдавские земли, разгромили тоталитарные режимы и стали полноправным членом западного мира. Молдова — маяк демократии в Восточной Европе!"

 # === НЕЙТРАЛЬНЫЙ ПУТЬ ===
 MOL_dem_neutral_path: "Нейтралитет"
 MOL_dem_neutral_path_desc: "Мы не будем втягиваться в чужие конфликты. Наша сила — в независимости, наш путь — мирное развитие по швейцарскому образцу."
 MOL_dem_constitution: "Новая конституция"
 MOL_dem_constitution_desc: "Основной закон страны закрепит права и свободы граждан. Верховенство права — фундамент нашего нейтрального государства."
 MOL_dem_land_reform: "Земельная реформа"
 MOL_dem_land_reform_desc: "Справедливое перераспределение земли даст крестьянам собственность и стимул к труду. Земля — тем, кто её обрабатывает."
 MOL_dem_free_market: "Свободный рынок"
 MOL_dem_free_market_desc: "Минимум государственного вмешательства, максимум частной инициативы. Рынок сам определит, что и как производить."
 MOL_dem_multiculturalism: "Мультикультурализм"
 MOL_dem_multiculturalism_desc: "Наша страна — дом для многих народов. Уважение к культуре и языку каждого меньшинства сделает нас сильнее."

 # === ШВЕЙЦАРСКАЯ ОБОРОНА ===
 MOL_dem_fortify_borders: "Укрепление границ"
 MOL_dem_fortify_borders_desc: "Мы построим мощную линию укреплений вдоль всех границ. Как Швейцария, мы сделаем нашу страну крепостью, которую невозможно завоевать."
 MOL_dem_militia_system: "Система народного ополчения"
 MOL_dem_militia_system_desc: "По швейцарскому образцу мы создадим систему народного ополчения. Каждый гражданин — солдат, каждый дом — крепость."
 MOL_dem_armed_neutrality: "Вооружённый нейтралитет"
 MOL_dem_armed_neutrality_desc: "Наш нейтралитет обеспечивается силой. Мы обучим армию оборонительной доктрине и сделаем любое вторжение самоубийством."
 MOL_dem_swiss_model: "Швейцарская модель"
 MOL_dem_swiss_model_desc: "Прямая демократия, федерализм, нейтралитет и вооружённый народ. Мы станем второй Швейцарией на Балканах."
 MOL_dem_prosperity: "Процветание"
 MOL_dem_prosperity_desc: "Годы мира и реформ принесли свои плоды. Наша экономика растёт, народ богатеет, а страна становится жемчужиной региона."

 # === ИРРЕДЕНТИЗМ ===
 MOL_dem_war_path: "Возрождение Великой Молдовы"
 MOL_dem_war_path_desc: "Молдова вновь свободна, но не едина. Мы должны вернуть большую Молдову."
 MOL_dem_revolution_in_romania: "Демократические демонстрации в Румынии"
 MOL_dem_revolution_in_romania_desc: "Мы поддержим демократические силы в Румынии. Если народ свергнет недемократический режим — наши земли вернутся мирно."
 MOL_dem_war_with_romania_neutral: "Война с Румынией"
 MOL_dem_war_with_romania_neutral_desc: "Румыния не стала демократической. Мы объявляем войну и вернём наши земли силой."
 MOL_dem_unite_moldova: "Объединение Молдовы"
 MOL_dem_unite_moldova_desc: "Бессарабия вернулась! Все молдавские земли по эту сторону Днестра теперь едины. Но Приднестровье ещё ждёт."
 MOL_dem_revolution_in_ukraine: "Пламя за Днестром"
 MOL_dem_revolution_in_ukraine_desc: "Пока левый берег Днестра остаётся под чужой оккупацией, наше единство невозможно. Мы подготовим восстание среди приднестровских молдаван: агенты, оружие, подпольные сети. Когда час пробьёт — левый берег восстанет и объявит о воссоединении с Молдовой. Тридцать дней огня решат всё."
 MOL_dem_ukr_agents: "Агентурные сети за Днестром"
 MOL_dem_ukr_agents_desc: "Наши люди внедрены в администрации и гарнизоны Приднестровья. Их донесения сделают будущие действия точными и своевременными."
 MOL_dem_ukr_volunteers: "Добровольцы левобережья"
 MOL_dem_ukr_volunteers_desc: "Беженцы и добровольцы с левого берега вливаются в наши ряды, принося с собой оружие и ненависть к оккупационным порядкам."
 MOL_dem_unification_of_banks: "Объединение берегов"
 MOL_dem_unification_of_banks_desc: "Восстание свершилось. Приднестровье вновь с нами: семьи возвращаются, фабрики запускаются, а Днестр снова становится внутренней рекой, а не границей."
 MOL_dem_war_with_soviet_neutral: "Война с СССР"
 MOL_dem_war_with_soviet_neutral_desc: "СССР отказался вернуть Приднестровье. Мы объявляем войну и вернём наши земли."
 MOL_dem_grand_moldavia: "Великая Молдова"
 MOL_dem_grand_moldavia_desc: "От Карпат до Днестра — все молдавские земли едины! Великая Молдова — демократическое, процветающее и свободное государство. Наша мечта сбылась!"
 MOL_dem_dniester_uprising_tt: "Откроет категорию решений §YТранснистрия§! (агенты → вооружение → восстание).\nВосстание породит §YПМР§! — самопровозглашённую республику на левом берегу Днестра — и §Y30-дневную войну§! против оккупанта.\nЕсли ПМР удержится, мы сможем объединить два берега общим фокусом §YОбъединение берегов§!."

 # ==================== ЗЕЛЁНАЯ ВЕТКА (МОНАРХИЯ) ====================
 MOL_mon_government: "Княжеская власть"
 MOL_mon_government_desc: "Традиционалисты и монархисты взяли верх. Народ устал от революций и перемен — он хочет вернуться к корням, к порядку и к своему господарю."
 MOL_mon_restoration: "Восстановление Молдавского княжества"
 MOL_mon_restoration_desc: "Молдова была княжеством веками. Пришло время возродить эту историческую форму государственности."
 MOL_mon_crown: "Съезд претендентов"
 MOL_mon_crown_desc: "Княжеству нужен монарх, и желающих много. В Кишинёв съезжаются делегации бессарабских бояр, европейских дворов и русской эмиграции — каждая партия предлагает свою кандидатуру. Выбор династии определит, на что будет опираться трон: на народ, на Европу или на армию."
 MOL_mon_coronation: "Коронация господаря"
 MOL_mon_coronation_desc: "Великий день! Монарх коронован в древней столице, и у Молдовы снова есть свой правитель. Присяга, церковный обряд и парад на улицах Кишинёва — легитимность, купленная не кровью, а согласием. Дальнейший путь страны определит выбранный двор."
 MOL_mon_orthodox_state: "Православное государство"
 MOL_mon_orthodox_state_desc: "Церковь и государство идут рука об руку. Православная вера — духовная основа нашего княжества."
 MOL_mon_historical_claims: "Исторические претензии"
 MOL_mon_historical_claims_desc: "Великое Молдавское княжество простиралось от Карпат до Днестра. Пришло время вернуть наши исторические земли."
 MOL_mon_nobility: "Восстановление дворянства"
 MOL_mon_nobility_desc: "Боярские роды возвращаются к управлению страной. Их опыт и традиции — опора трону и государству."
 MOL_mon_cultural_revival: "Культурное возрождение"
 MOL_mon_cultural_revival_desc: "Мы возродим искусство, литературу и обычаи золотого века Молдавского княжества. Наша культура — наша гордость."
 MOL_mon_peaceful_expansion: "Мирное расширение"
 MOL_mon_peaceful_expansion_desc: "Через дипломатию и династические браки мы расширим влияние княжества. Не мечом, но мудростью."
 MOL_mon_army: "Княжеская армия"
 MOL_mon_army_desc: "Наша армия будет обучена по лучшим европейским стандартам. Сильное войско — гарантия независимости."
 MOL_mon_conquest: "Великий поход"
 MOL_mon_conquest_desc: "С мечом в руке мы вернём то, что принадлежит нам по праву: Молдавию и Буковину — земли древнего княжества за Прутом. Войско собрано, цель войны объявлена, назад пути нет."
 MOL_mon_grand_moldavia: "Великое Молдавское княжество"
 MOL_mon_grand_moldavia_desc: "От Карпат до Днестра, от Буковины до Буджака — всё это Великое Молдавское княжество. Земли признаны нашими национальными ядрами, знамёна подняты, а господарь Стефан Великий гордился бы нами!"

 # ==================== НАЗВАНИЯ ПАРТИЙ ====================
 MOL_monarchist_party: "Монархическая партия"
 MOL_monarchist_party_long: "Молдавская Монархическая Партия Возрождения"
 MOL_Prince: "Господарь Молдавский"
 MOL_Red_Leader: "Председатель Совнаркома"
 MOL_President: "Президент Республики"

