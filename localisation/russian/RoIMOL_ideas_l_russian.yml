
l_russian:
 ROM_bessarabian_industry: "Бессарабия: Экономические реформы"
 ROM_bessarabian_patriots: "Бессарабия: Патриотические настроения"
 MOL_regional_stability: "Стабильность в регионах"
 ROM_bessarabian_volunteers: "Бессарабия: Добровольцы"

 ROM_MOL_industry_idea: "Новая индустриальная политика"
 ROM_MOL_army_idea: "Молдавская румынская армия"
 ROM_MOL_army_idea_desc: "Молдавская румынская армия - отдельная армия Молдавской автономии. Она является восточным щитом Великой Румынии"
 rom_mol_army_attack.t: "Атака на нац. территориях увеличится на 5%"
 rom_mol_army_defence.t: "Защита на нац. территориях увеличится на 10%"

 MOL_partisan_defense: "Партизанская оборона"
 MOL_partisan_defense_desc: "Наши войска готовы сражаться за каждый клочок родной земли. Оккупанты заплатят кровью за каждый шаг."

 MOL_cultural_autonomy: "Культурная автономия"
 MOL_cultural_autonomy_desc: "Молдавский язык, школа и церковь признаны властями. Народ спокоен и готов защищать родную землю."

 MOL_wine_exports: "Винный экспорт"
 MOL_wine_exports_desc: "Молдавские вина расходятся по всей Европе, наполняя казну и смягчая нравы иностранных кабинетов."

 MOL_commissariat_rule: "Румынский комиссариат"
 MOL_commissariat_rule_desc: "Королевский комиссар с чрезвычайными полномочиями контролирует каждое решение Кишинёва. Самостоятельность автономии скована, общество подавлено, а путь к свободе перекрыт бюрократией."

 MOL_red_militia: "Красное ополчение"
 MOL_red_militia_desc: "Рабочие отряды сражаются с яростью классового гнева."

 MOL_blue_guard: "Гражданская гвардия"
 MOL_blue_guard_desc: "Ополчение советов держит строй и веру в республику."

 MOL_green_partisans: "Хайдучьи сотни"
 MOL_green_partisans_desc: "Отряды традиционалистов неуловимы и стойки в обороне родной земли."

 MOL_victorious_nation: "Нация-победительница"
 MOL_victorious_nation_desc: "Мы выстояли против метрополии. Весь народ сплочён вокруг завоёванной свободы."

 MOL_transnistria_reunion: "Воссоединение берегов"
 MOL_transnistria_reunion_desc: "Приднестровье снова с нами: новые рекруты, возвращённые семьи и общая линия обороны по Днестру."
 MOL_minority_harmony: "Согласие народов"
 MOL_minority_harmony_desc: "Все народы Бессарабии получили равные права. Внутренний мир стал нашей силой."
 MOL_autonomy_prosperity: "Процветание автономии"
 MOL_autonomy_prosperity_desc: "Единый рынок и связанная промышленность дают казне стабильный доход и низкие издержки."

 # === НОВЫЕ МОДИФИКАТОРЫ ПОСЛЕ ПОБЕДЫ ===

 # --- Коммунистические ---
 MOL_soviet_industrialization: "Советская индустриализация"
 MOL_soviet_industrialization_desc: "Пятилетний план по советскому образцу превращает Молдову в индустриальную державу. Каждый завод — шаг к социализму."

 MOL_collectivized_farms: "Коллективизированные хозяйства"
 MOL_collectivized_farms_desc: "Колхозы и совхозы обеспечивают продовольственную безопасность и высвобождают рабочие руки для промышленности."

 MOL_nationalized_industry: "Национализированная промышленность"
 MOL_nationalized_industry_desc: "Заводы и фабрики принадлежат народу. Плановая экономика работает на общее благо."

 MOL_red_militia_forces: "Народное ополчение"
 MOL_red_militia_forces_desc: "Вместо профессиональной армии — вооружённый народ. Каждый рабочий готов встать на защиту революции."

 # --- Демократические ---
 MOL_british_trade: "Британская торговля"
 MOL_british_trade_desc: "Свободная торговля с Британской империей приносит экономический рост и технологический обмен."

 MOL_free_speech: "Свобода слова"
 MOL_free_speech_desc: "Свободная пресса и открытые дискуссии укрепляют демократию и доверие граждан к власти."

 MOL_land_reform: "Земельная реформа"
 MOL_land_reform_desc: "Справедливое перераспределение земли дало крестьянам собственность и стимул к труду."

 MOL_free_market_economy: "Свободная рыночная экономика"
 MOL_free_market_economy_desc: "Частная инициатива и конкуренция двигают экономику вперёд. Молдова становится региональным экономическим центром."

 MOL_multicultural_state: "Мультикультурное государство"
 MOL_multicultural_state_desc: "Уважение ко всем народам и культурам сделало Молдову образцом толерантности в регионе."

 # --- Новые демократические модификаторы (расширенная ветка) ---
 MOL_fortified_neutrality: "Укреплённая нейтральность"
 MOL_fortified_neutrality_desc: "Мощная линия укреплений вдоль всех границ делает нашу страну крепостью. Как Швейцария, мы защищены от любого вторжения."

 MOL_militia_system: "Система народного ополчения"
 MOL_militia_system_desc: "По швейцарскому образцу каждый гражданин — солдат. Ополчение готово защитить страну в любой момент."

 MOL_armed_neutrality: "Вооружённый нейтралитет"
 MOL_armed_neutrality_desc: "Наш нейтралитет обеспечивается силой. Армия обучена оборонительной доктрине, а любое вторжение станет самоубийством для агрессора."

 MOL_swiss_model: "Швейцарская модель"
 MOL_swiss_model_desc: "Прямая демократия, федерализм, нейтралитет и вооружённый народ. Мы — вторая Швейцария на Балканах."

 MOL_democratic_prosperity: "Демократическое процветание"
 MOL_democratic_prosperity_desc: "Годы мира, свободных рынков и демократических реформ превратили Молдову в экономический центр региона."

 MOL_democratic_triumph: "Демократический триумф"
 MOL_democratic_triumph_desc: "Мы вернули все земли, разгромили тиранию и стали маяком демократии. Молдова — лидер свободного мира в Восточной Европе!"

 MOL_grand_moldavia: "Великая Молдова"
 MOL_grand_moldavia_desc: "От Карпат до Днестра — все молдавские земли едины. Великая Молдова — демократическая, процветающая и свободная. Наша мечта сбылась!"

 # --- Монархические ---
 MOL_princely_rule: "Княжеская власть"
 MOL_princely_rule_desc: "Господарь правит твёрдой рукой, опираясь на традицию и веру. Народ видит в нём защитника и отца нации."

 MOL_orthodox_state: "Православное государство"
 MOL_orthodox_state_desc: "Церковь и государство идут рука об руку. Вера сплачивает народ и даёт ему духовную опору."

 MOL_restored_nobility: "Восстановленное дворянство"
 MOL_restored_nobility_desc: "Боярские роды вернулись к управлению. Их опыт и преданность трону укрепляют государство."

 # ======================================================
 # === НОВЫЕ КОММУНИСТИЧЕСКИЕ МОДИФИКАТОРЫ ===
 # ======================================================
 MOL_securitate: "Секуритате"
 MOL_securitate_desc: "Тайная полиция охраняет революцию от внутренних врагов. Ни один контрреволюционер не уйдёт от правосудия."
 MOL_securitate_lar: "Секуритате (разведка)"
 MOL_securitate_lar_desc: "Молдавская служба государственной безопасности ведёт разведку, контрразведку и подавление врагов народа."
 MOL_independent_socialism: "Независимый социализм"
 MOL_independent_socialism_desc: "Молдова строит социализм по-своему — без указки из Москвы. Наш путь уникален."
 MOL_soviet_aid: "Советская помощь"
 MOL_soviet_aid_desc: "Москва поддерживает нас техникой, специалистами и ресурсами. Братская помощь великого соседа."
 MOL_soviet_military_advisors: "Советские военные советники"
 MOL_soviet_military_advisors_desc: "Красные командиры делятся боевым опытом с нашей армией. Мы перенимаем лучшие практики Красной Армии."
 MOL_market_socialism: "Рыночный социализм"
 MOL_market_socialism_desc: "Предприятия принадлежат рабочим, но рынок определяет цены. Гибридная модель сочетает свободу и справедливость."
 MOL_command_economy: "Командная экономика"
 MOL_command_economy_desc: "Государственный план определяет всё: что производить, кому продавать, сколько платить. Максимальная мобилизация ресурсов."
 MOL_independent_trade_policy: "Независимая торговая политика"
 MOL_independent_trade_policy_desc: "Мы торгуем со всеми — и с социалистами, и с капиталистами. Прагматизм выше идеологии."
 MOL_red_army: "Красная армия Молдовы"
 MOL_red_army_desc: "Армия нового типа: дисциплинированная, идеологически закалённая, готовая защищать революцию."
 MOL_partisan_warfare: "Партизанская война"
 MOL_partisan_warfare_desc: "Наш опыт подпольной борьбы стал военной доктриной. Каждый гражданин — потенциальный партизан."
 MOL_international_brigades: "Интернациональные бригады"
 MOL_international_brigades_desc: "Добровольцы со всего мира стекаются под наши красные знамёна. Мировая революция начинается здесь."
 MOL_fighting_fascism: "Борьба с фашизмом"
 MOL_fighting_fascism_desc: "Мы объявили войну фашизму во всех его проявлениях. Каждое фашистское государство — наш враг."
 MOL_anti_fascist_propaganda: "Антифашистская пропаганда"
 MOL_anti_fascist_propaganda_desc: "Наши радиостанции и листовки несут правду о фашизме в соседние страны. Идеологическая борьба продолжается."
 MOL_revolutionary_organizations_activity: "Активность революционных организаций"
 MOL_revolutionary_organizations_desc: "Молдавские агитаторы ведут работу в соседних странах, готовя почву для революций."
 MOL_balkan_economic_integration: "Балканская экономическая интеграция"
 MOL_balkan_economic_integration_desc: "Единый рынок Балкан: общая валюта, свободное перемещение товаров, скоординированное планирование."
 MOL_balkan_political_integration: "Балканская политическая интеграция"
 MOL_balkan_political_integration_desc: "Общие политические институты сближают балканские народы. Скоро границы останутся только на картах."
 MOL_balkan_military_integration: "Балканская военная интеграция"
 MOL_balkan_military_integration_desc: "Единое командование, общие стандарты обучения, скоординированная оборона. Балканская Красная Армия."
 MOL_political_turmoil: "Политические беспорядки"
 MOL_political_turmoil_desc: "Объединение стольких народов под одним знаменем вызвало хаос. Необходимо время для стабилизации."
 MOL_peoples_moldavia: "Народная Молдова"
 MOL_peoples_moldavia_desc: "Мы построили социализм, объединили Балканы и стали региональной сверхдержавой. Наша мечта сбылась."

 # --- Сотрудничество с Коминтерном ---
 MOL_comintern_cooperation: "Сотрудничество с Коминтерном"
 MOL_comintern_cooperation_desc: "Идеологическая близость с Коммунистическим Интернационалом приносит Молдове политическую поддержку и экономическую помощь от братских партий."

 # --- Статус Молдавской ССР ---
 MOL_ssr_status: "Молдавская ССР"
 MOL_ssr_status_desc: "Войдя в состав Советского Союза, Молдова получила статус союзной республики. Москва вкладывает ресурсы в развитие нового региона."

 # --- Отказ СССР ---
 MOL_soviet_rejection: "Самостоятельный путь"
 MOL_soviet_rejection_desc: "СССР отказал нам в интеграции. Но мы не сдаёмся — мы построим социализм своими силами и докажем миру нашу жизнеспособность."

 # --- Балканские временные идеи ---
 MOL_worker_strikes: "Забастовки рабочих"
 MOL_worker_strikes_desc: "Массовые забастовки парализуют промышленность. Рабочие требуют перемен."
 MOL_panslavic_propaganda: "Панславянская пропаганда"
 MOL_panslavic_propaganda_desc: "Идея славянского единства распространяется среди населения, усиливая симпатии к коммунизму."
 MOL_panbalkan_propaganda: "Панбалканская пропаганда"
 MOL_panbalkan_propaganda_desc: "Пропаганда балканского единства и солидарности ослабляет позиции существующих режимов."

 # --- Мнения ---
 MOL_ideological_solidarity: "Идеологическая солидарность"
 MOL_trading_partner: "Торговый партнёр"
 MOL_trading_partner_less: "Снижение торговых отношений"
 MOL_favouritism_in_trading: "Предпочтение в торговле"
 MOL_trade_agreement: "Торговое соглашение"
 MOL_subversive_diplomacy: "Подрывная дипломатия"
 MOL_disappointed_soviet: "Разочарование Москвы"
 MOL_accepted_ultimatum: "Принятый ультиматум"
 MOL_rejected_ultimatum: "Отклонённый ультиматум"

 # --- Демократические мнения ---
 MOL_democratic_cooperation: "Демократическое сотрудничество"
 MOL_anti_fascist_diplomacy: "Антифашистская дипломатия"
 MOL_rejected_cooperation: "Отказ от сотрудничества"
 MOL_accepted_demands: "Принятые требования"
 MOL_rejected_demands: "Отклонённые требования"

 # --- Демократическое влияние (временная идея) ---
 MOL_democratic_influence: "Демократическое влияние"
 MOL_democratic_influence_desc: "Молдавские агенты поддерживают демократические силы в нашей стране. Народ всё больше склоняется к демократии, а существующий режим теряет легитимность."

 # === Неполитические модификаторы ===
 MOL_agrarian_economy: "Аграрная экономика"
 MOL_agrarian_economy_desc: "Бессарабия остаётся краем крестьян и пастухов. Промышленность развита слабо, но земля даёт нам жизнь и опору."
 MOL_vineyard_economy: "Виноградники Кодру"
 MOL_vineyard_economy_desc: "Молдавские вина — от «Негру де Пурчурь» до «Фетяска» — знают во всей Европе. Экспорт даёт казне стабильный доход."
 MOL_light_industry: "Пищевая промышленность"
 MOL_light_industry_desc: "Консервные заводы, сахарные мельницы и маслобойни превращают дары чернозёма в товары, идущие на экспорт."
 MOL_war_workshops: "Военные мастерские"
 MOL_war_workshops_desc: "Небольшие мастерские Кишинёва и Тирасполя перестраиваются на выпуск вооружений для обороны родной земли."
 MOL_river_defense: "Оборона на реках"
 MOL_river_defense_desc: "Прут и Днестр — наши естественные крепости. Инженерные работы превратят берега в неприступные рубежи."
 MOL_ro_officers: "Румынские инструкторы"
 MOL_ro_officers_desc: "Офицеры румынской армии делятся опытом с нашими командирами. Профессионализм растёт, но цена — зависимость."
 MOL_local_officers: "Местные командиры"
 MOL_local_officers_desc: "Выходцы из молдавских сёл и городов возглавляют войска. Они знают свою землю и будут защищать её до конца."
 MOL_militia_reserves: "Ополченческие резервы"
 MOL_militia_reserves_desc: "Каждый крестьянин с ружьём — потенциальный защитник родины. Система народного ополчения удваивает наш мобилизационный резерв."
 MOL_artillery_school: "Артиллерийская школа"
 MOL_artillery_school_desc: "Специалисты-артиллеристы обучаются в новой школе под Кишинёвом. Наш огонь становится точнее и смертоноснее."
 MOL_air_club_modifier: "Аэроклуб Кишинёва"
 MOL_air_club_modifier_desc: "Энтузиасты-авиаторы готовят будущих пилотов. Каждый час в небе — шаг к собственной авиации."
 MOL_air_licenses_modifier: "Лицензионное производство"
 MOL_air_licenses_modifier_desc: "Мы покупаем лицензии на иностранные самолёты и строим их на своих заводах. Дешевле и быстрее, чем разрабатывать с нуля."
 MOL_cas_support: "Поддержка с воздуха"
 MOL_cas_support_desc: "Штурмовики — глаза и кулак армии на поле боя. Наши пилоты учатся работать в паре с пехотой."
 MOL_danube_flotilla_modifier: "Днестровская флотилия"
 MOL_danube_flotilla_modifier_desc: "Небольшие речные мониторы и сторожевые катера охраняют наши водные рубежи. Малый флот для малой страны."
 MOL_port_izmail: "Порт Измаил"
 MOL_port_izmail_desc: "Дунайский порт Измаил — наши ворота в Чёрное море. Торговля и военная логистика идут через него."
 MOL_monitors: "Речные мониторы"
 MOL_monitors_desc: "Бронированные речные корабли поддерживают армию огнём с воды и охраняют переправы."

 # === Имена новых фокусов (дублируются в файле фокусов для надёжности) ===
 MOL_unlock_officer_forks_tt: "§YРазблокирует выбор§!: §GРумынские инструкторы§! или §GМестные командиры§!"
 
 MOL_communist_agitation:0 "Коммунистическая агитация"
 MOL_communist_agitation_desc:0 "Молдавские товарищи финансируют забастовки и подпольные ячейки: стабильность правительства падает, а популярность коммунистов растёт каждый день."
 MOL_democratic_agitation:0 "Демократическая агитация"
 MOL_democratic_agitation_desc:0 "Кишинёв поддерживает демократические движения и свободную прессу за рубежом: позиции демократов крепнут день ото дня."
 MOL_democratic_opposition:0 "Демократическая оппозиция"
 MOL_democratic_opposition_desc:0 "Оппозиция, организованная при поддержке Молдовы, парализует работу правительства и требует свободных выборов."

 # --- Боевой дух против Румынии (демократическая ветка) ---
 MOL_war_against_romania: "Война за Молдавию"
 MOL_war_against_romania_desc: "Вся страна поднята на борьбу за возвращение молдавских земель за Прутом. Наши войска сражаются с особой яростью на западном направлении: выше атака и оборона в боях против Румынии. Дух поддерживает народ только пока идёт война и только первые полгода."

 # --- Нацдухи династий (зелёная ветка) ---
 MOL_native_dynasty_spirit: "Земское собрание короны"
 MOL_native_dynasty_spirit_desc: "Господарь правит вместе с представителями жудецов, городов и церкви: решения медленнее, но народ считает их своими. Оборона родной земли крепче, призыв выше, а часть урожая не уходит на экспорт — всё для своей армии."
 MOL_habsburg_court: "Габсбургский двор"
 MOL_habsburg_court_desc: "Кишинёвский двор живёт по европейским правилам: дипломатическая школа, займы, приглашённые инженеры и профессора. Дружба с другими странами обходится дешевле, стройка и наука идут быстрее, а казна меньше тратит на товары народного потребления."
 MOL_romanov_court: "Имперский двор в изгнании"
 MOL_romanov_court_desc: "Офицеры и чиновники Белой эмиграции заняли места в армии и управлении. Обучение быстрее, организация выше, предел капитуляции и сроки оправдания войны короче — но двор требует денег, а народ устал от чужой войны."

 # --- Нацдухи линий зелёной ветки (v2) ---
 MOL_native_church_autonomy: "Автокефальная митрополия"
 MOL_native_church_autonomy_desc: "Молдавская церковь независима от Бухареста и верна трону: народ спокоен, прирост населения выше, а чужие идеологии приживаются плохо."
 MOL_native_border_fortress: "Крепость на Пруте"
 MOL_native_border_fortress_desc: "Линия бункеров и укреплений по Пруту и Днестру: оборона родной земли значительно крепче, износ войск ниже, а капитулировать страна не собирается."
 MOL_habs_trade_league: "Дунайская торговая лига"
 MOL_habs_trade_league_desc: "Единые пошлины и защищённые караваны по Дунаю: торговля приносит больше, стройка идёт быстрее, а потребительские товары обходятся дешевле."
 MOL_habs_court_academy: "Академия двора"
 MOL_habs_court_academy_desc: "Придворная академия ускоряет исследования и укрепляет управление: наука двора работает и на армию, и на мануфактуры."
 MOL_danubian_empire: "Соединённые Королевства Дуная"
 MOL_danubian_empire_desc: "Составная монархия дворов: общая корона, армия и внешняя политика при местных сеймах. Стабильность, промышленность и оборона империи значительно выше."
 MOL_white_army: "Белая армия"
 MOL_white_army_desc: "Офицерский костяк эмиграции: организация и наступление войск выше, обучение быстрее, призыв эффективнее."
 MOL_cossack_hosts: "Казачьи войска"
 MOL_cossack_hosts_desc: "Конные станицы на службе двора: войска быстрее, организация выше, износ в походах ниже."
 MOL_third_rome: "Третий Рим"
 MOL_third_rome_desc: "Двор как хранитель православной державности: стабильность и поддержка войны выше, чужая идеология не приживается, а цели войны оправдываются быстрее."
 MOL_imperial_throne: "Всероссийский престол"
 MOL_imperial_throne_desc: "Императорская корона в Кишинёве: атака и оборона войск значительно выше, призыв шире, предел капитуляции выше — но двор и армия требуют больших потребительских расходов."
