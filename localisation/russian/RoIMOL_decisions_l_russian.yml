l_russian:
 # ========== ПРИДНЕСТРОВСКИЙ ВОПРОС ==========
 MOL_transnistria_category: "Приднестровский вопрос"
 MOL_transnistria_category_desc: "Борьба за возвращение исконно молдавских земель за Днестром."
 # Решения
 MOL_prepare_agents: "Подготовить сеть агентов"
 MOL_prepare_agents_desc: "Заложить ячейки сопротивления в Приднестровье. Агенты будут координировать будущее восстание. Потребуются винтовки для первых отрядов."
 MOL_arm_rebels: "Вооружить повстанцев"
 MOL_arm_rebels_desc: "Переправить оружие и боеприпасы приднестровским партизанам. Это ослабит нашу армию, но усилит восстание. Требуется крупная партия винтовок."
 MOL_start_uprising: "Начать восстание"
 MOL_start_uprising_desc: "Отдать приказ к всеобщему восстанию в Приднестровье. Наши агенты и повстанцы готовы. Риск велик, но ставка того стоит."
 # Ивент
 transnistria_events.1.t: "Восстание в Приднестровье!"
 transnistria_events.1.d: "По нашему сигналу приднестровские патриоты подняли оружие против украинской администрации. Крупные города охвачены боями. Пламя свободы перекидывается на соседние регионы."
 transnistria_events.1.a: "Да здравствует свободная Молдова! Вперёд!"

 # ========== ОТНОШЕНИЯ С БУХАРЕСТОМ ==========
 ROM_MOL_bucharest_category: "Отношения с Бухарестом"
 ROM_MOL_bucharest_category_desc: "Тонкая игра с метрополией. Текущее доверие Бухареста: §Y[?rom_mol_trust|0]§!%.\n\n§GВыше 70§! — король склонен даровать милости.\n§RНиже 30§! — Бухарест готов прислать комиссара с карательными полномочиями.\n\nФокусы ветки автономии и решения этой категории сдвигают шкалу."
 # Решения
 ROM_MOL_tribute_king: "Отправить дань уважения королю"
 ROM_MOL_tribute_king_desc: "Дары, верноподданнические адреса и пожертвования ко двору укрепят расположение Бухареста."
 ROM_MOL_national_festival: "Провести национальный праздник"
 ROM_MOL_national_festival_desc: "Праздник молдавской культуры сплотит народ, но в столице его сочтут дерзостью."
 ROM_MOL_negotiate_rights: "Выторговать новые права"
 ROM_MOL_negotiate_rights_desc: "Долгие переговоры с министерствами о передаче части полномочий Кишинёву. Продвижение к свободе ценой раздражения Бухареста."
 ROM_MOL_crackdown_radicals: "Прижать местных радикалов"
 ROM_MOL_crackdown_radicals_desc: "Аресты заговорщиков и успокоение улиц покажут Бухаресту, что мы держим регион в узде. Народ этого не забудет."

 # ========== ВОЙНА ЗА НЕЗАВИСИМОСТЬ ==========
 MOL_independence_war_category: "Война за независимость"
 MOL_independence_war_category_desc: "Молдова должна продержаться 30 дней против Румынии. Если линия фронта не рухнет — Бухарест признает независимость белым миром."
 MOL_thirty_days_of_fire: "Тридцать дней огня"
 MOL_thirty_days_of_fire_desc: "Пока таймер идёт, Молдова держится. По истечении срока будет заключён белый мир и признана независимость Молдовы. Если Молдова капитулирует раньше — миссия прервётся, страна будет потеряна."
 ROM_thirty_days_of_fire: "Усмирить Бессарабию"
 ROM_thirty_days_of_fire_desc: "Мятеж в Бессарабии должен быть подавлен за тридцать дней. Если линия фронта не рухнет к этому сроку, придётся признать независимость Молдовы."

 # ========== КОММУНИСТИЧЕСКИЕ РЕШЕНИЯ ==========
 MOL_communist_decisions_category: "Коммунистическая политика"
 MOL_communist_decisions_category_desc: "Решения для коммунистического правительства Молдовы: поддержка революций, индустриализация и укрепление власти."
 MOL_support_romania_revolution: "Поддержать революцию в Румынии"
 MOL_support_romania_revolution_desc: "Наши агитаторы активизируют работу в Румынии. Это дестабилизирует режим и укрепит позиции коммунистов."
 MOL_support_bulgaria_revolution: "Поддержать революцию в Болгарии"
 MOL_support_bulgaria_revolution_desc: "Болгарские товарищи получат нашу поддержку. Скоро София станет красной."
 MOL_support_greece_revolution: "Поддержать революцию в Греции"
 MOL_support_greece_revolution_desc: "Греческие коммунисты получат оружие, деньги и идеологическую поддержку."
 MOL_send_volunteers_to_greece: "Отправить добровольцев в Грецию"
 MOL_send_volunteers_to_greece_desc: "10 000 добровольцев и 2000 единиц оружия для греческих товарищей."
 MOL_extra_five_year_plan: "Дополнительная пятилетка"
 MOL_extra_five_year_plan_desc: "Новый виток индустриализации: ещё один гражданский и один военный завод."
 MOL_party_congress: "Партийный съезд"
 MOL_party_congress_desc: "Всенародный съезд Партии Коммунистов Молдовы укрепит единство и легитимность власти."
 MOL_crackdown: "Подавить восстание"
 MOL_crackdown_desc: "Секуритате жёстко подавит любые проявления недовольства. Порядок любой ценой."

 # ========== БАЛКАНСКИЕ КОММУНИСТИЧЕСКИЕ РЕШЕНИЯ ==========
 MOL_balkan_communist_federation_category: "Балканская революция"
 MOL_balkan_communist_federation_category_desc: "Распространение коммунизма на Балканах через пропаганду, забастовки, ультиматумы и интеграцию. Путь к Балканской Коммунистической Федерации."

 # --- Ультиматумы ---
 MOL_communist_ultimatum_romania: "Ультиматум Румынии"
 MOL_communist_ultimatum_romania_desc: "Предъявить Бухаресту ультиматум: принять коммунизм или столкнуться с последствиями. Рабочие готовы к восстанию."
 MOL_communist_ultimatum_bulgaria: "Ультиматум Болгарии"
 MOL_communist_ultimatum_bulgaria_desc: "София должна выбрать: коммунизм или война. Наши агитаторы уже работают в болгарских городах."
 MOL_communist_ultimatum_greece: "Ультиматум Греции"
 MOL_communist_ultimatum_greece_desc: "Афины стоят перед выбором: принять волю пролетариата или столкнуться с революционным натиском."
 MOL_communist_ultimatum_albania: "Ультиматум Албании"
 MOL_communist_ultimatum_albania_desc: "Тирана должна присоединиться к Балканской Федерации. Коммунизм — единственное будущее для албанского народа."
 MOL_communist_ultimatum_turkey: "Ультиматум Турции"
 MOL_communist_ultimatum_turkey_desc: "Анкара получит ультиматум. Турецкий пролетариат ждёт нашего сигнала."

 # --- Забастовки ---
 MOL_organize_workers_strikes_rom: "Организовать забастовки в Румынии"
 MOL_organize_workers_strikes_rom_desc: "Наши агенты организуют массовые забастовки на румынских заводах. Промышленность будет парализована."
 MOL_organize_workers_strikes_bul: "Организовать забастовки в Болгарии"
 MOL_organize_workers_strikes_bul_desc: "Болгарские рабочие выйдут на забастовку по нашему сигналу."
 MOL_organize_workers_strikes_gre: "Организовать забастовки в Греции"
 MOL_organize_workers_strikes_gre_desc: "Греческие рабочие присоединятся к борьбе за социализм."

 # --- Пропаганда ---
 MOL_panslavic_propaganda_bulgaria: "Панславянская пропаганда в Болгарии"
 MOL_panslavic_propaganda_bulgaria_desc: "Идея славянского единства особенно близка болгарам. Наша пропаганда найдёт отклик."
 MOL_panbalkan_propaganda_rom: "Панбалканская пропаганда в Румынии"
 MOL_panbalkan_propaganda_rom_desc: "Лозунги балканского единства ослабят позиции румынского режима."
 MOL_panbalkan_propaganda_gre: "Панбалканская пропаганда в Греции"
 MOL_panbalkan_propaganda_gre_desc: "Греки услышат наш призыв к солидарности балканских народов."
 MOL_panbalkan_propaganda_alb: "Панбалканская пропаганда в Албании"
 MOL_panbalkan_propaganda_alb_desc: "Албанский народ готов к объединению с братскими народами Балкан."
 MOL_panbalkan_propaganda_tur: "Панбалканская пропаганда в Турции"
 MOL_panbalkan_propaganda_tur_desc: "Турецкие рабочие и крестьяне готовы услышать правду."

 # --- Поддержка компартий ---
 MOL_support_communist_party_rom: "Поддержать компартию Румынии"
 MOL_support_communist_party_rom_desc: "Финансовая и организационная помощь румынским коммунистам укрепит их позиции."
 MOL_support_communist_party_bul: "Поддержать компартию Болгарии"
 MOL_support_communist_party_bul_desc: "Болгарские товарищи получат нашу поддержку."
 MOL_support_communist_party_gre: "Поддержать компартию Греции"
 MOL_support_communist_party_gre_desc: "Греческие коммунисты получат оружие и деньги."
 MOL_support_communist_party_alb: "Поддержать компартию Албании"
 MOL_support_communist_party_alb_desc: "Албанская компартия окрепнет с нашей помощью."
 MOL_support_communist_party_tur: "Поддержать компартию Турции"
 MOL_support_communist_party_tur_desc: "Турецкие товарищи получат нашу поддержку."

 # --- Приглашение в федерацию ---
 MOL_invite_to_balkan_federation: "Пригласить в Балканскую Федерацию"
 MOL_invite_to_balkan_federation_desc: "Отправить официальное приглашение коммунистическому правительству вступить в нашу федерацию."

 # --- Интеграция ---
 MOL_invite_to_economic_integration: "Экономическая интеграция"
 MOL_invite_to_economic_integration_desc: "Предложить союзнику присоединиться к единому экономическому пространству Балкан."
 MOL_invite_to_political_integration: "Политическая интеграция"
 MOL_invite_to_political_integration_desc: "Предложить союзнику общие политические институты."
 MOL_invite_to_military_integration: "Военная интеграция"
 MOL_invite_to_military_integration_desc: "Предложить союзнику единое военное командование."
 MOL_integrate_balkan_country: "Интегрировать балканскую страну"
 MOL_integrate_balkan_country_desc: "Полная аннексия союзной балканской республики. Все институты объединяются, границы стираются."

 # ========== ДЕМОКРАТИЧЕСКИЕ РЕШЕНИЯ ==========
 MOL_democratic_decisions_category: "Демократическая политика"
 MOL_democratic_decisions_category_desc: "Решения для демократического правительства Молдовы: поддержка демократии за рубежом, укрепление обороны и ирредентистские операции."

 MOL_dem_request_british_investment: "Запросить британские инвестиции"
 MOL_dem_request_british_investment_desc: "Лондон готов инвестировать в нашу экономику. Британский капитал ускорит развитие промышленности."
 MOL_dem_joint_military_exercises: "Совместные учения с Британией"
 MOL_dem_joint_military_exercises_desc: "Британские офицеры проведут совместные учения с нашей армией. Мы перенимаем лучшие практики западной военной школы."
 MOL_dem_support_democratic_romania: "Поддержать демократов в Румынии"
 MOL_dem_support_democratic_romania_desc: "Наши агенты поддержат демократические силы в Румынии. Если народ свергнет диктатуру — наши земли вернутся мирно."
 MOL_dem_guarantee_independence: "Гарантировать независимость"
 MOL_dem_guarantee_independence_desc: "Мы гарантируем независимость демократического балканского государства. Если кто-то нападёт на них — мы вступимся."
 MOL_dem_send_volunteers: "Отправить добровольцев"
 MOL_dem_send_volunteers_desc: "Мы отправим 5 000 добровольцев и 1 000 единиц оружия демократическим государствам, ведущим войну против тирании."
 MOL_dem_build_fortifications: "Построить дополнительные укрепления"
 MOL_dem_build_fortifications_desc: "Дополнительный слой укреплений вдоль границ. Каждый бункер — это жизни наших солдат."
 MOL_dem_expand_militia: "Расширить ополчение"
 MOL_dem_expand_militia_desc: "Призвать новых граждан в народное ополчение. Больше бойцов — крепче оборона."
 MOL_dem_incite_unrest_romania: "Разжечь волнения в Румынии"
 MOL_dem_incite_unrest_romania_desc: "Наши агенты активизируют пропаганду в Румынии. Волнения ослабят режим и приблизят возвращение наших земель."
 MOL_dem_support_ukrainian_dissidents: "Поддержать диссидентов на Украине"
 MOL_dem_support_ukrainian_dissidents_desc: "Мы поддержим демократические силы на Украине и в СССР. Тоталитарный режим должен пасть."
