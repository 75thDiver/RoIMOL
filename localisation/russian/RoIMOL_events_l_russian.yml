l_russian:
 #Romania.1
 romania.1.c: "Это дело центра"
 
 #MOL
 moldavia.1.t: "Мы свободны!"
 moldavia.1.d: "Спустя десятки лет мы обрели свободу! Теперь это новый веток развития Молдавии!"
 moldavia.1.a: "Это нужно отметить! Несите вино из погреба!"
 moldavia.2.t: "Изменения правительства в Румынии"
 moldavia.2.d: "В нашей стране произошла смена правительства. Мы вынуждены сменить его по примеру центра"
 moldavia.2.com: "Да здравствует революция!"
 moldavia.2.dem: "Во имя демократии!"
 moldavia.2.fas: "За нацию и Румынию!"
 moldavia.2.neu: "За короля!"
 
 moldavia.3.t: "Румыны Бессарабии просят автономии"
 moldavia.3.d: "Наши жудецы в Бессарабии просят нас об объединении самой Бессарабии на основе их "особенностей региона как в субэтническом, так и культурном плане". Нам необходимо решить что будем делать с жидецами"
 moldavia.3.a: "Может быть они в чём-то отличны от нас, но несущественно..."
 moldavia.3.b: "Ни за что! ПОСАДИТЬ ИЗМЕНЩИКОВ!"

 moldavia.4.t: "Румыния согласна!"
 moldavia.4.d: ""
 moldavia.4.a: "ДА ЗДРАВСТВУЕТ МОЛДАВИЯ И ЕЁ КОРОЛЬ!"
 
 moldavia.5.t: "Молдавское Собрание"
 moldavia.5.d: "Мы добились невероятного — наша автономия процветает. У нас есть заводы, шахты, новые города и собственная армия. Теперь перед нами стоит главный вопрос: останемся ли мы верной частью Румынии или потребуем полной независимости? Делегаты Собрания ждут вашего слова."
 moldavia.5.a: "Молдова — верная часть Румынии. Да здравствует король!"
 moldavia.5.b: "Хватит! Молдова должна быть свободной!"
 
 moldavia.6.t: "Решение Собрания"
 moldavia.6.d: "Молдавское Собрание приняло решение. Теперь нам предстоит пожинать его плоды."
 moldavia.6.a: "Да будет так."
 moldavia.6.b: "Борьба только начинается."
 
 moldavia.7.t: "Бессарабия с нами!"
 moldavia.7.d: "Делегаты Молдавского Собрания единогласно проголосовали за воссоединение с Румынией. Молдаване Бессарабии признают себя частью великой румынской нации и просят принять их земли в состав Королевства. Наши братья наконец вернулись домой!"
 moldavia.7.a: "Добро пожаловать домой, братья!"
 
 moldavia.8.t: "Просьба о воссоединении молдавских земель"
 moldavia.8.d: "Молдавская автономия обращается к нам с предложением завершить объединение всех молдавских земель. Речь идёт о присоединении [This.GetName] (79) и [This.GetName] (80) к составу Королевства. Это укрепит наши позиции в регионе и положит конец территориальным спорам."
 moldavia.8.a: "Мы принимаем! Да здравствует Великая Румыния!"
 moldavia.8.b: "Всему есть предел. Мы отказываемся."
 
 romania.1.d: "Мы не можем решать за Молдавский румынский народ"
 
 moldavia.9.t: "Судьба Бессарабии в наших руках"
 moldavia.9.d: "Советский Союз требует передачи бессарабских земель. Бухарест оставляет решение за нами — Молдавское Собрание уполномочено говорить от имени народа. Мы должны выбрать: уступить требованиям Москвы или отстаивать свою землю с оружием в руках."
 moldavia.9.a: "Мы не готовы к войне. Отдать территории..."
 moldavia.9.b: "Бессарабия была и будет нашей! К оружию!"

  # Ультиматум сепаратистов
 moldavia.10.t: "Молдавский ультиматум!"
 moldavia.10.d: "Правительство в Кишинёве полностью вышло из-под контроля. Оно объявило о намерении выйти из состава Королевства и потребовало немедленного признания независимости. В Бессарабии массовые митинги и вооружённые столкновения. Как ответим на мятеж?"
 moldavia.10.a: "Мы не можем удержать их силой. Пусть уходят."
 moldavia.10.b: "Изменники! Армия усмирит их. Румыния едина!"
 # Недовольство Бухареста (доверие < 30)
 moldavia.11.t: "Бухарест недоволен"
 moldavia.11.d: "Из столицы прибыл королевский комиссар с полномочиями «навести порядок». Наши вольности названы саботажем. Бухарест требует демонстрации покорности — иначе последуют аресты и роспуск местных органов."
 moldavia.11.a: "Подчиниться: принять комиссара и условия Бухареста"
 moldavia.11.b: "Отказать: Молдова свободна — пусть попробуют взять её силой"
 # Милость короля (доверие > 70)
 moldavia.12.t: "Милость короля"
 moldavia.12.d: "Наши верность и усердие замечены при дворе. Король Кароль II готов даровать Молдавской автономии одну просьбу. Чем мы воспользуемся?"
 moldavia.12.a: "Просить инвестиций в наши земли"
 moldavia.12.b: "Просить расширения прав автономии"
 moldavia.12.c: "Благодарить и продолжать служить"
 # Реакция на давление
 moldavia.13.t: "Реакция Бухареста"
 moldavia.13.d: "Наш меморандум о расширении прав вызвал бурю в столице. Как ответит Бухарест?"
 moldavia.13.a: "Скрипя зубами, они уступают"
 moldavia.13.b: "Нам угрожают! Бухарест в ярости"
 # Скрытые баффы в час войны
 moldavia.14.t: "Час пробил!"
 moldavia.14.d: "Война с Румынией началась. По всему краю подпольные ячейки выходят из тени: формируются отряды народного ополчения, открываются тайные склады. То, что мы готовили годами, теперь решает всё."
 moldavia.14.a: "Вперёд, за свободную Молдову!"
 # Белый мир
 moldavia.15.t: "Прутский мир"
 moldavia.15.d: "Тридцать дней огня не сломили Молдову. Бухарест, исчерпав силы и терпение, соглашается на белый мир. Де-юре признаётся независимость молдавского государства. Мы выстояли."
 moldavia.15.a: "Мы держались месяц — и мы свободны."
 # Послевоенная консолидация
 moldavia.16.t: "Строительство новой Молдовы"
 moldavia.16.d: "Война окончена, страна свободна. Теперь предстоит решить, какой будет эта свобода: её формой, содержанием и знаменем."
 moldavia.16.com: "Власть — советам, заводы — рабочим!"
 moldavia.16.dem: "Свободные выборы и парламент!"
 moldavia.16.neu: "Опираемся на традицию и порядок."
 moldavia.16.fas: "Нация, вождь и дисциплина."

 # Выборы после победы
 moldavia.17.t: "Выборы в свободной Молдове"
 moldavia.17.d: "Война окончена, и народ Молдовы впервые голосует свободно. Результат ясен: те, кто вёл нас через тридцать дней огня, получили доверие избирателей. Страна стоит на пороге новой эпохи. Какой будет наша Молдова?"
 moldavia.17.red: "Красные знамёна над Кишинёвом! Победа коммунистов!"
 moldavia.17.blue: "Демократия восторжествовала! Свободные выборы подтвердили волю народа."
 moldavia.17.green: "Традиция побеждает! Народ выбрал порядок и веру в господаря."

 # =============================================
 # БАЛКАНСКИЕ СОБЫТИЯ
 # =============================================
 MOL_balkan_events.1.t: "Коммунистический ультиматум от Молдовы"
 MOL_balkan_events.1.d: "Молдова предъявила нам ультиматум: принять коммунистическую идеологию и присоединиться к Балканской Федерации, или столкнуться с последствиями. Наши агенты сообщают о массовых волнениях и забастовках. Коммунистические ячейки активизировались. Что мы ответим?"
 MOL_balkan_events.1.a: "Принять: народ требует перемен"
 MOL_balkan_events.1.b: "Отказаться: мы не поддадимся давлению!"

 MOL_balkan_events.2.t: "Они приняли ультиматум!"
 MOL_balkan_events.2.d: "Правительство согласилось на наши условия. Коммунистические силы взяли верх, и страна готова к интеграции в нашу федерацию. Это великая победа мировой революции!"
 MOL_balkan_events.2.a: "Да здравствует балканское единство!"

 MOL_balkan_events.3.t: "Они отказались!"
 MOL_balkan_events.3.d: "Реакционный режим отверг наш ультиматум. Они выбрали конфронтацию вместо братского единства. Что же, мы готовы защитить интересы пролетариата силой. Цель войны уже готова."
 MOL_balkan_events.3.a: "Революция не знает преград. Вперёд!"

 # =============================================
 # СОВЕТСКИЕ СОБЫТИЯ (Вхождение в СССР)
 # =============================================
 MOL_soviet.1.t: "Молдова просит войти в состав СССР"
 MOL_soviet.1.d: "Кишинёв обратился к Москве с официальным запросом о вхождении Молдавской Социалистической Республики в состав Советского Союза. Молдавские товарищи выражают полную готовность стать союзной республикой. Как ответит Кремль?"
 MOL_soviet.1.a: "Принять: добро пожаловать, Молдавская ССР!"
 MOL_soviet.1.b: "Отказать: Молдова ещё не готова"

 MOL_soviet.2.t: "СССР принял нас!"
 MOL_soviet.2.d: "Москва ответила согласием! Молдова получает статус Молдавской Советской Социалистической Республики — полноправного субъекта Советского Союза. Советские войска входят для обеспечения безопасности, а московские специалисты начинают работу по интеграции нашей экономики в общесоюзный план."
 MOL_soviet.2.a: "Да здравствует Советский Союз!"

 MOL_soviet.3.t: "Москва отказала"
 MOL_soviet.3.d: "Кремль вежливо, но твёрдо отклонил нашу просьбу. В Москве считают, что Молдова ещё недостаточно созрела для полной интеграции. Отношения с СССР охладились, но мы не сдаёмся — мы продолжим строить социализм самостоятельно."
 MOL_soviet.3.a: "Мы докажем свою жизнеспособность!"

 # =============================================
 # СОВЕТСКИЕ НОВОСТИ
 # =============================================
 MOL_soviet_news.1.t: "Образование Молдавской ССР"
 MOL_soviet_news.1.d: "Молдова официально вошла в состав Советского Союза, получив статус союзной республики. Новое образование — Молдавская Советская Социалистическая Республика — стало 16-й республикой великого Союза. Москва празднует расширение социалистического лагеря."
 MOL_soviet_news.1.a: "Новая глава в истории Молдовы"
 MOL_soviet_news.1.b: "Ещё одна республика в семье народов"
 MOL_soviet_news.1.c: "Социалистический лагерь крепнет"
 MOL_soviet_news.1.e: "Тревожный сигнал для Запада"

 # =============================================
 # ДЕМОКРАТИЧЕСКИЕ СОБЫТИЯ (Расширенная ветка)
 # =============================================

 MOL_dem_events.1.t: "Демократический ультиматум от Молдовы"
 MOL_dem_events.1.d: "Молдова предъявила нам ультиматум: передать ей Молдавию (79) и Буковину (80) и допустить к власти демократическое правительство. Кишинёв заручился поддержкой западных держав и раздал гарантии балканским странам — воевать с ним значит воевать почти в одиночестве. Генералы предупреждают, что кампания за Карпатами истощит страну. Как мы ответим?"
 MOL_dem_events.1.a: "Уступить: земли и демократия — цена мира"
 MOL_dem_events.1.b: "Отказ: никогда!"

 MOL_dem_events.2.t: "Румыния уступила!"
 MOL_dem_events.2.d: "Бухарест принял ультиматум: молдавские земли за Прутом возвращены, а в Румынии сформировано демократическое правительство. Ни одного выстрела — и Молдова стала единой от Карпат до Днестра. Народ празднует великую дипломатическую победу."
 MOL_dem_events.2.a: "Да здравствует единая Молдова!"

 MOL_dem_events.3.t: "Румыния отказала!"
 MOL_dem_events.3.d: "Бухарест отверг ультиматум: ни земель, ни смены правительства. Румынское правительство делает ставку на силу и уже укрепляет границу вдоль Прута. У нас есть законная цель войны — дальше всё решит армия."
 MOL_dem_events.3.a: "К оружию! Бессарабия будет нашей!"

 MOL_dem_events.4.t: "Молдавский ультиматум по Приднестровью"
 MOL_dem_events.4.d: "Молдова требует передачи Приднестровья и территорий за Днестром. Они заручились поддержкой западных держав и угрожают войной. Как ответим?"
 MOL_dem_events.4.a: "Уступить Приднестровье"
 MOL_dem_events.4.b: "Отказ: Приднестровье наше!"

 MOL_dem_events.5.t: "Молдавская поддержка демократии"
 MOL_dem_events.5.d: "Молдова предлагает нам поддержку в проведении демократических реформ. Их агенты помогают организовать свободные выборы и защищать права оппозиции. Примем ли мы их помощь?"
 MOL_dem_events.5.a: "Принять: демократия — наше будущее"
 MOL_dem_events.5.b: "Отказ: не ваше дело"

 # Новости: Объединение Молдовы (демократический путь)
 MOL_dem_news.1.t: "Историческое объединение Молдовы!"
 MOL_dem_news.1.d: "В беспрецедентном историческом событии все молдавские земли — от Карпат до Днестра — объединились в единое демократическое государство. Молдова стала маяком свободы и демократии в Восточной Европе."
 MOL_dem_news.1.a: "Да здравствует Великая Молдова!"
 MOL_dem_news.1.b: "Триумф демократии!"
 MOL_dem_news.1.c: "Новая сила на Балканах"
