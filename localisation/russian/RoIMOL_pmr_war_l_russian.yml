l_russian:
 transnistria_events.2.t: "Приднестровье выстояло"
 transnistria_events.2.d: "Тридцать дней огня не сломили республику на Днестре. Противник, исчерпав силы, соглашается на белый мир. Де-факто независимость Приднестровья признана."
 transnistria_events.2.a: "Мы выстояли! Республика живёт!"
 transnistria_events.3.t: "Воссоединение берегов"
 transnistria_events.3.d: "Приднестровская республика, не связанная союзами и войнами, добровольно входит в состав Молдовы. Днестр вновь становится внутренней рекой единой страны."
 transnistria_events.3.a: "Добро пожаловать домой, братья с Днестра!"
 PMR_independence_war_category: "Война за независимость Приднестровья"
 PMR_independence_war_category_desc: "Приднестровье должно продержаться 30 дней против бывшего владельца. Если линия фронта не рухнет — республика отстоит свою независимость белым миром."
 PMR_thirty_days_of_fire: "Тридцать дней Днестра"
 PMR_thirty_days_of_fire_desc: "Пока таймер идёт, ополчение держит берег. По истечении срока бывший владелец признает независимость Приднестровья белым миром. Если республика падёт раньше — миссия прервётся."
 SOV_thirty_days_of_fire: "Подавление приднестровского мятежа"
 SOV_thirty_days_of_fire_desc: "Ополчение на Днестре держится. За 30 дней либо сломить сопротивление и вернуть земли, либо признать поражение и заключить белый мир."
