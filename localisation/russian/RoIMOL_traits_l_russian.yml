l_russian:
 # Custom leader traits
 prince_of_moldavia: "Господарь Молдавский"
 prince_of_moldavia_desc: "Правитель Молдавского княжества, потомок древних господарей. Его власть освящена традицией и волей народа."
 red_vozhd: "Красный вождь"
 red_vozhd_desc: "Вождь молдавского пролетариата, ведущий народ к светлому социалистическому будущему."
 president_of_republic: "Президент Республики"
 president_of_republic_desc: "Избранный глава демократической Молдавской Республики, гарант конституции и прав граждан."

 # Трейты династий (зелёная ветка)
 bogdanovici_dynasty: "Дом Богдановичей"
 bogdanovici_dynasty_desc: "Господарь из молдавских бояр: трон опирается на землю, церковь и земское собрание. Народ видит в правителе своего, страна устойчива к чужой идеологии, но двор с подозрением относится к иностранным наукам."
 habsburg_diplomat: "Габсбургский дипломат"
 habsburg_diplomat_desc: "Монарх из европейского дома: связи венского двора, кредиты и династическая дипломатия. Торговля и наука выигрывают, однако «чужой» король не вдохновляет крестьян на войну."
 romanov_imperial: "Император в изгнании"
 romanov_imperial_desc: "Государь российской императорской ветви, перенёсший двор в Кишинёв. Эмиграция даёт ему офицеров, дисциплину и людские резервы, но содержание двора дорого, а легитимность внутри страны спорна."
