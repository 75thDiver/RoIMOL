l_russian:

 rom_mol_trust_up_tt: "§GДоверие Бухареста вырастет§!"
 rom_mol_trust_down_tt: "§RДоверие Бухареста упадёт§!"
 MOL_prep_war_tt: "§YСкрытый эффект:§! когда начнётся война с Румынией, подполье поднимется — подпольные ячейки выйдут из тени, открыв тайные склады оружия."
 MOL_dem_dniester_uprising_tt: "Откроет категорию решений §YТранснистрия§! (агенты → вооружение → восстание).\nВосстание породит §YПМР§! — самопровозглашённую республику на левом берегу Днестра — и §Y30-дневную войну§! против оккупанта.\nЕсли ПМР удержится, мы сможем объединить два берега общим фокусом §YОбъединение берегов§!."

 # Новости: объединение Балкан
 MOL_news.1.t: "Историческое объединение Балкан!"
 MOL_news.1.d: "В беспрецедентном историческом событии социалистические республики Балканского полуострова объявили о полном объединении. Молдова, Румыния, Болгария, Греция и Албания сливаются в единое государство — Балканский Союз Социалистических Республик. Новое государство, с центром в Кишинёве, становится крупнейшей державой Юго-Восточной Европы. Мировое сообщество в шоке: коммунистическая сверхдержава возникла прямо в сердце Европы."
 MOL_news.1.a: "Да здравствует Балканский Союз!"

 # --- Демократическая ветка: Балканы и ультиматум Румынии ---
 MOL_dem_guarantee_balkans_tt: "Наши §Gгарантии независимости§! получат §YБолгария§!, §YГреция§!, §YАлбания§!, §YЮгославия§! и §YТурция§! — если они демократические и не являются чьими-либо субъектами. §RРумыния§! в этот список не входит."
 MOL_dem_ultimatum_accepted: "Румыния приняла ультиматум"
 MOL_dem_ultimatum_rejected: "Румыния отклонила ультиматум"
 MOL_dem_ultimatum_demands_tt: "Румынии будет предъявлен §Yультиматум§!: передать Молдове §YМолдавию§! (79) и §YБуковину§! (80), а также §Yсменить правительство§! на демократическое.\nЕсли Бухарест §Gпримет§! условия — земли переходят к нам, Румыния становится демократией и открывается фокус §YСоюз с демократической Румынией§!.\nЕсли §Rоткажет§! — мы получим §Yцель войны§! на эти регионы, а фокус §YВойна за Молдавию§! откроется после начала боевых действий."
 MOL_war_against_romania_tt: "Добавит национальный дух §YВойна за Молдавию§! на §Y180 дней§!: §G+15%§! атака и §G+20%§! оборона в боях против §RРумынии§!. Дух действует, только пока мы воюем с ней."

 # --- Зелёная ветка: династии ---
 MOL_mon_dynasty_choice_tt: "Откроет §Yвыбор династии§! (три взаимоисключающих фокуса):\n§YДом Богдановичей§! — свой господарь: выше стабильность и призыв, сильнее оборона родной земли, но медленнее исследования.\n§YГабсбургская корона§! — европейский двор: торговля, наука и дипломатия, но ниже призыв и поддержка войны.\n§YРомановский скипетр§! — двор в изгнании: армия, мобилизация и реванш, но дороже для казны и с враждой Москвы."
 MOL_mon_dynasty_native_tt: "Господарем станет §YМирча IV Богданович§! — потомок бессарабских боярских родов.\nТрейт §YДом Богдановичей§!: §G+8%§! стабильность, §G+5%§! поддержка войны, §G+1%§! призыв, §Gзащита от чужой идеологии§!; §R-5%§! скорость исследований."
 MOL_mon_dynasty_habsburg_tt: "Корону примет §Yэрцгерцог Леопольд-Карл фон Габсбург-Лотарингский§!.\nТрейт §YГабсбургский дипломат§!: §G+25%§! влияние торговли на мнение, §G+5%§! исследования, §G-25%§! стоимость улучшения отношений, §G+10%§! политическая власть; §R-10%§! призыв, §R-5%§! поддержка войны.\nДворы-единомышленники (§YАвстрия§!, §YВенгрия§!, §YРумыния§!, §YИталия§!) получат §Yторговое соглашение§!."
 MOL_mon_dynasty_romanov_tt: "Государем станет §YАлексий III Романов§! — глава императорской ветви в изгнании.\nТрейт §YИмператор в изгнании§!: §G+5%§! организация армии, §G-10%§! время обучения, §G+10%§! призыв, §G+10%§! предел капитуляции, §G-10%§! время оправдания цели войны; §R-8%§! стабильность, §R+5%§! потребительские товары.\n§RСССР отнесётся к нам резко отрицательно§!, но в страну придут §G+15 000§! человек из эмиграции."
 MOL_mon_danubian_pact_tt: "Создаст фракцию §YДунайский пакт§! и направит приглашения §YАвстрии§!, §YВенгрии§!, §YРумынии§!, §YБолгарии§!, §YГреции§!, §YЮгославии§! и §YАлбании§! — если они не коммунистические, не являются чьими-либо субъектами, не состоят во фракции и не воюют с нами."
 MOL_mon_romanov_uprising_tt: "Откроет категорию решений §YТранснистрия§! (агенты → вооружение → восстание).\nВосстание породит §YПМР§! и §Y30-дневную войну§! против владельца 834. Поскольку восстание поднято двором, республика получит косметический тег §YПриднестровское царское ополчение§! (процарские лоялисты).\nЕсли ПМР удержится, фокус §YВоссоединение под императорским знаменем§! присоединит её к нам."
